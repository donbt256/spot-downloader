name: Download Music

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Check out downloader
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install FFmpeg and Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git-lfs
          git lfs install

      - name: Install spotDL
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spotdl==4.5.2"

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check installed versions
        run: |
          python --version
          ffmpeg -version | head -n 1
          deno --version
          spotdl --version
          git lfs version

      - name: Prepare directories
        run: |
          rm -rf /tmp/music-downloads
          mkdir -p /tmp/music-downloads

          rm -f /tmp/all-tracks.json
          rm -f /tmp/track-urls.txt

          touch archive.txt
          touch failed.txt

      - name: Resolve Spotify URLs into individual tracks
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -u

          : > /tmp/track-urls.txt

          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "${url//[[:space:]]/}" ] && continue

            case "$url" in
              \#*) continue ;;
            esac

            echo ""
            echo "========================================"
            echo "Resolving:"
            echo "$url"
            echo "========================================"

            rm -f /tmp/current.spotdl

            if ! spotdl save "$url" \
              --client-id "$SPOTIFY_CLIENT_ID" \
              --client-secret "$SPOTIFY_CLIENT_SECRET" \
              --save-file /tmp/current.spotdl
            then
              echo "Could not resolve: $url"
              echo "$url" >> failed.txt
              continue
            fi

            python - <<'PY'
          import json

          path = "/tmp/current.spotdl"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit(f"Unexpected spotDL save format: {type(data)}")

          with open("/tmp/track-urls.txt", "a", encoding="utf-8") as out:
              for song in data:
                  url = song.get("url")

                  if url:
                      out.write(url + "\n")

                      name = song.get("name", "Unknown")
                      artist = song.get("artist", "Unknown")
                      print(f"TRACK: {artist} - {name}")
                      print(f"       {url}")
          PY

          done < urls.txt

          sort -u /tmp/track-urls.txt -o /tmp/track-urls.txt

          echo ""
          echo "========================================"
          echo "Resolved tracks:"
          echo "========================================"

          wc -l /tmp/track-urls.txt
          cat /tmp/track-urls.txt

      - name: Download each track with explicit fallback
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -u

          failed=0

          while IFS= read -r track || [ -n "$track" ]; do
            [ -z "${track//[[:space:]]/}" ] && continue

            echo ""
            echo "########################################"
            echo "TRACK"
            echo "$track"
            echo "########################################"

            success=0

            # --------------------------------------------------
            # Provider 1: SoundCloud
            # --------------------------------------------------

            echo ""
            echo "Trying SoundCloud..."

            if spotdl download "$track" \
              --client-id "$SPOTIFY_CLIENT_ID" \
              --client-secret "$SPOTIFY_CLIENT_SECRET" \
              --audio soundcloud \
              --format mp3 \
              --bitrate 128k \
              --output "/tmp/music-downloads/{artist}/{album}/{track-number} - {title}.{output-ext}" \
              --overwrite skip \
              --archive archive.txt \
              --max-retries 2 \
              --threads 1 \
              --print-errors
            then
              echo "SoundCloud succeeded."
              success=1
            else
              echo "SoundCloud failed."
            fi

            if [ "$success" -eq 1 ]; then
              continue
            fi

            # --------------------------------------------------
            # Provider 2: Bandcamp
            # --------------------------------------------------

            echo ""
            echo "Trying Bandcamp..."

            if spotdl download "$track" \
              --client-id "$SPOTIFY_CLIENT_ID" \
              --client-secret "$SPOTIFY_CLIENT_SECRET" \
              --audio bandcamp \
              --format mp3 \
              --bitrate 128k \
              --output "/tmp/music-downloads/{artist}/{album}/{track-number} - {title}.{output-ext}" \
              --overwrite skip \
              --archive archive.txt \
              --max-retries 2 \
              --threads 1 \
              --print-errors
            then
              echo "Bandcamp succeeded."
              success=1
            else
              echo "Bandcamp failed."
            fi

            if [ "$success" -eq 1 ]; then
              continue
            fi

            # --------------------------------------------------
            # Provider 3: Piped
            # --------------------------------------------------

            echo ""
            echo "Trying Piped..."

            if spotdl download "$track" \
              --client-id "$SPOTIFY_CLIENT_ID" \
              --client-secret "$SPOTIFY_CLIENT_SECRET" \
              --audio piped \
              --format mp3 \
              --bitrate 128k \
              --output "/tmp/music-downloads/{artist}/{album}/{track-number} - {title}.{output-ext}" \
              --overwrite skip \
              --archive archive.txt \
              --max-retries 2 \
              --threads 1 \
              --print-errors
            then
              echo "Piped succeeded."
              success=1
            else
              echo "Piped failed."
            fi

            if [ "$success" -eq 1 ]; then
              continue
            fi

            # --------------------------------------------------
            # Everything failed
            # --------------------------------------------------

            echo ""
            echo "ALL PROVIDERS FAILED:"
            echo "$track"

            echo "$track" >> failed.txt
            failed=1

          done < /tmp/track-urls.txt

          exit "$failed"

      - name: Show downloaded files
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "Downloaded files"
          echo "========================================"

          if [ -d /tmp/music-downloads ]; then
            find /tmp/music-downloads -type f -print | sort
          else
            echo "No download directory."
          fi

      - name: Show failure log
        if: always()
        run: |
          echo ""
          echo "========================================"
          echo "Failed tracks"
          echo "========================================"

          if [ -s failed.txt ]; then
            cat failed.txt
          else
            echo "No failed tracks."
          fi

      - name: Check library repository
        if: always()
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -e

          rm -rf /tmp/music-library

          GIT_LFS_SKIP_SMUDGE=1 git clone \
            "https://x-access-token:${GIT_PAT}@github.com/donbt256/music-library-001.git" \
            /tmp/music-library

          cd /tmp/music-library

          git lfs install

          echo ""
          echo "Library repository:"
          git remote -v

      - name: Copy downloads into library
        if: always()
        run: |
          set -e

          if [ ! -d /tmp/music-downloads ]; then
            echo "No downloads directory."
            exit 0
          fi

          if [ -z "$(find /tmp/music-downloads -type f -print -quit)" ]; then
            echo "No new music was downloaded."
            exit 0
          fi

          cp -a /tmp/music-downloads/. /tmp/music-library/

      - name: Configure Git LFS
        if: always()
        working-directory: /tmp/music-library
        run: |
          set -e

          git lfs install

          cat > .gitattributes <<'EOF'
          *.mp3 filter=lfs diff=lfs merge=lfs -text
          *.flac filter=lfs diff=lfs merge=lfs -text
          *.m4a filter=lfs diff=lfs merge=lfs -text
          *.ogg filter=lfs diff=lfs merge=lfs -text
          *.opus filter=lfs diff=lfs merge=lfs -text
          *.wav filter=lfs diff=lfs merge=lfs -text
          EOF

      - name: Commit library
        if: always()
        working-directory: /tmp/music-library
        run: |
          set -e

          git config user.name "spot-downloader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .gitattributes
          git add .

          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi

          git commit -m "Add downloaded music"

      - name: Push library
        if: always()
        working-directory: /tmp/music-library
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -e

          git push origin main

      - name: Commit downloader state
        if: always()
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -e

          git config user.name "spot-downloader"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive.txt failed.txt

          if git diff --cached --quiet; then
            echo "No downloader state changes."
            exit 0
          fi

          git commit -m "Update download state"
          git push
