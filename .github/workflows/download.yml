name: Download Spotify Music

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

env:
  LIBRARY_OWNER: "donbt256"
  LIBRARY_PREFIX: "music-library-"
  LIBRARY_LIMIT_BYTES: "943718400"
  AUDIO_FORMAT: "mp3"
  AUDIO_BITRATE: "128k"

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Check out downloader repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Install spotDL
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spotdl==4.5.2"

      - name: Install Deno
        run: |
          spotdl --download-deno

      - name: Prepare directories
        run: |
          rm -rf /tmp/music-downloads
          rm -rf /tmp/library
          rm -rf /tmp/library-scan

          mkdir -p /tmp/music-downloads
          mkdir -p /tmp/library-scan

          touch archive.txt
          touch failed.txt

          : > /tmp/track-urls.txt
          : > /tmp/resolution-failures.txt
          : > /tmp/successful-tracks.txt
          : > /tmp/had-download-failures
          : > /tmp/library-hashes.txt

      - name: Resolve Spotify URLs
        env:
          SPOTIFY_CLIENT_ID: "${{ secrets.SPOTIFY_CLIENT_ID }}"
          SPOTIFY_CLIENT_SECRET: "${{ secrets.SPOTIFY_CLIENT_SECRET }}"
        run: |
          set -u

          while IFS= read -r source || [ -n "$source" ]; do
            if [ -z "${source//[[:space:]]/}" ]; then
              continue
            fi

            echo ""
            echo "========================================"
            echo "Resolving:"
            echo "$source"
            echo "========================================"

            rm -f /tmp/current.spotdl

            if spotdl save "$source" \
              --client-id "$SPOTIFY_CLIENT_ID" \
              --client-secret "$SPOTIFY_CLIENT_SECRET" \
              --save-file /tmp/current.spotdl
            then
              python -c 'import json; songs=json.load(open("/tmp/current.spotdl", encoding="utf-8")); [print(s["url"]) for s in songs if s.get("url") and "open.spotify.com/track/" in s["url"]]' \
                >> /tmp/track-urls.txt
            else
              echo "Resolution failed:"
              echo "$source"

              printf "%s\n" "$source" \
                >> /tmp/resolution-failures.txt
            fi
          done < urls.txt

          sort -u /tmp/track-urls.txt -o /tmp/track-urls.txt

          echo ""
          echo "Resolved tracks:"
          wc -l /tmp/track-urls.txt

          if [ -s /tmp/resolution-failures.txt ]; then
            echo ""
            echo "Resolution failures:"
            cat /tmp/resolution-failures.txt
          fi

      - name: Download tracks
        env:
          SPOTIFY_CLIENT_ID: "${{ secrets.SPOTIFY_CLIENT_ID }}"
          SPOTIFY_CLIENT_SECRET: "${{ secrets.SPOTIFY_CLIENT_SECRET }}"
        run: |
          set -u

          had_failures=0

          while IFS= read -r track || [ -n "$track" ]; do
            if [ -z "${track//[[:space:]]/}" ]; then
              continue
            fi

            echo ""
            echo "########################################"
            echo "TRACK"
            echo "$track"
            echo "########################################"

            if grep -Fqx "$track" archive.txt; then
              echo "Already downloaded. Skipping."
              continue
            fi

            success=0
            successful_file=""

            for provider in soundcloud bandcamp piped; do
              echo ""
              echo "----------------------------------------"
              echo "Trying $provider"
              echo "----------------------------------------"

              find /tmp/music-downloads \
                -type f \
                -iname "*.mp3" \
                -printf "%p\n" \
                | sort > /tmp/before-mp3.txt

              spotdl download "$track" \
                --client-id "$SPOTIFY_CLIENT_ID" \
                --client-secret "$SPOTIFY_CLIENT_SECRET" \
                --audio "$provider" \
                --format "$AUDIO_FORMAT" \
                --bitrate "$AUDIO_BITRATE" \
                --output "/tmp/music-downloads/{artist}/{album}/{track-number} - {title}.{output-ext}" \
                --overwrite skip \
                --max-retries 2 \
                --threads 1 \
                --print-errors \
                || true

              find /tmp/music-downloads \
                -type f \
                -iname "*.mp3" \
                -printf "%p\n" \
                | sort > /tmp/after-mp3.txt

              comm -13 \
                /tmp/before-mp3.txt \
                /tmp/after-mp3.txt \
                > /tmp/new-mp3.txt

              while IFS= read -r candidate || [ -n "$candidate" ]; do
                if [ -z "$candidate" ]; then
                  continue
                fi

                if [ ! -s "$candidate" ]; then
                  continue
                fi

                if ffprobe \
                  -v error \
                  -select_streams a:0 \
                  -show_entries stream=duration \
                  -of default=noprint_wrappers=1:nokey=1 \
                  "$candidate" \
                  > /tmp/duration.txt 2>/dev/null
                then
                  duration=$(tr -d "\r\n" < /tmp/duration.txt)

                  if awk "BEGIN { exit !($duration > 5) }"; then
                    successful_file="$candidate"
                    success=1
                    break
                  fi
                fi
              done < /tmp/new-mp3.txt

              if [ "$success" -eq 1 ]; then
                echo ""
                echo "$provider succeeded."
                echo "Verified file:"
                echo "$successful_file"
                break
              fi

              echo "$provider did not produce a verified MP3."
            done

            if [ "$success" -eq 1 ]; then
              echo ""
              echo "TRACK SUCCESS"

              echo "$track" >> archive.txt
              echo "$track" >> /tmp/successful-tracks.txt
            else
              echo ""
              echo "ALL PROVIDERS FAILED"

              timestamp=$(date -u "+%Y-%m-%dT%H:%M:%SZ")

              printf "%s | %s\n" \
                "$timestamp" \
                "$track" >> failed.txt

              had_failures=1
            fi
          done < /tmp/track-urls.txt

          sort -u archive.txt -o archive.txt

          echo "$had_failures" > /tmp/had-download-failures

          echo ""
          echo "========================================"
          echo "DOWNLOAD SUMMARY"
          echo "========================================"

          echo ""
          echo "Successful tracks:"

          if [ -s /tmp/successful-tracks.txt ]; then
            wc -l /tmp/successful-tracks.txt
          else
            echo "0"
          fi

          echo ""
          echo "Failed tracks:"

          if [ -s failed.txt ]; then
            tail -n 50 failed.txt
          else
            echo "0"
          fi

      - name: Show downloaded files
        run: |
          echo "Downloaded audio:"

          find /tmp/music-downloads \
            -type f \
            -iname "*.mp3" \
            -printf "%p (%s bytes)\n" \
            | sort || true

      - name: Push music to library repositories
        env:
          GIT_PAT: "${{ secrets.GIT_PAT }}"
        run: |
          set -euo pipefail

          API="https://api.github.com"
          API_VERSION="2022-11-28"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          export GIT_TERMINAL_PROMPT=0

          api_get() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$1"
          }

          api_post() {
            curl -fsSL \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              -H "Content-Type: application/json" \
              "$1" \
              -d "$2"
          }

          if ! find /tmp/music-downloads \
            -type f \
            -iname "*.mp3" \
            -print -quit |
            grep -q .
          then
            echo "No new music was downloaded."
            exit 0
          fi

          highest_number=0
          page=1

          while true; do
            repos=$(api_get \
              "${API}/user/repos?visibility=all&affiliation=owner&per_page=100&page=${page}")

            count=$(printf "%s" "$repos" | jq "length")

            if [ "$count" -eq 0 ]; then
              break
            fi

            while IFS= read -r repo_name; do
              if [[ "$repo_name" =~ ^${LIBRARY_PREFIX}([0-9]+)$ ]]; then
                number="${BASH_REMATCH[1]}"
                number=$((10#$number))

                if [ "$number" -gt "$highest_number" ]; then
                  highest_number="$number"
                fi
              fi
            done < <(printf "%s" "$repos" | jq -r ".[].name")

            page=$((page + 1))
          done

          if [ "$highest_number" -lt 1 ]; then
            highest_number=1
          fi

          current_number="$highest_number"

          printf -v current_repo \
            "${LIBRARY_PREFIX}%03d" \
            "$current_number"

          echo ""
          echo "Current library:"
          echo "$current_repo"

          ensure_repo() {
            local repo="$1"

            if api_get \
              "${API}/repos/${LIBRARY_OWNER}/${repo}" \
              >/dev/null 2>&1
            then
              echo "Repository exists: $repo"
              return
            fi

            echo ""
            echo "Creating private repository: $repo"

            body=$(jq -n \
              --arg name "$repo" \
              '{
                name: $name,
                private: true,
                description: "Music library",
                has_issues: false,
                has_projects: false,
                has_wiki: false,
                has_discussions: false,
                has_downloads: true,
                auto_init: false
              }')

            api_post \
              "${API}/user/repos" \
              "$body" >/dev/null

            echo "Created: $repo"
          }

          clone_library() {
            local repo="$1"

            ensure_repo "$repo"

            rm -rf /tmp/library

            echo ""
            echo "Cloning $repo..."

            git clone \
              "https://x-access-token:${GIT_PAT}@github.com/${LIBRARY_OWNER}/${repo}.git" \
              /tmp/library

            cd /tmp/library

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          }

          get_library_size() {
            cd /tmp/library

            git ls-files -z |
              while IFS= read -r -d '' file; do
                if [ -f "$file" ]; then
                  stat -c "%s" "$file"
                fi
              done |
              awk '
                {
                  total += $1
                }
                END {
                  print total + 0
                }
              '
          }

          build_hash_index() {
            local repo="$1"

            echo ""
            echo "Building MD5 index for:"
            echo "$repo"

            rm -rf "/tmp/library-scan/$repo"

            git clone \
              --quiet \
              "$(
                printf '%s' \
                "https://x-access-token:${GIT_PAT}@github.com/${LIBRARY_OWNER}/${repo}.git"
              )" \
              "/tmp/library-scan/$repo"

            while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                md5sum "$file" | awk '{print $1}'
              fi
            done < <(
              find "/tmp/library-scan/$repo" \
                -type f \
                -iname "*.mp3" \
                -print0
            )
          }

          echo ""
          echo "========================================"
          echo "BUILDING LIBRARY HASH INDEX"
          echo "========================================"

          : > /tmp/library-hashes.txt

          page=1

          while true; do
            repos=$(api_get \
              "${API}/user/repos?visibility=all&affiliation=owner&per_page=100&page=${page}")

            count=$(printf "%s" "$repos" | jq "length")

            if [ "$count" -eq 0 ]; then
              break
            fi

            while IFS= read -r repo_name; do
              if [[ "$repo_name" =~ ^${LIBRARY_PREFIX}[0-9]+$ ]]; then
                build_hash_index "$repo_name" \
                  >> /tmp/library-hashes.txt
              fi
            done < <(printf "%s" "$repos" | jq -r ".[].name")

            page=$((page + 1))
          done

          sort -u /tmp/library-hashes.txt \
            -o /tmp/library-hashes.txt

          echo ""
          echo "Existing unique MP3 hashes:"
          wc -l /tmp/library-hashes.txt

          hash_exists() {
            local hash="$1"

            grep -Fqx "$hash" /tmp/library-hashes.txt
          }

          push_library() {
            local size="$1"

            cd /tmp/library

            echo ""
            echo "Pushing $current_repo"
            echo "Library size: $size bytes"

            printf "%s\n" "$size" > .library-size-bytes

            git add .

            if ! git diff --cached --quiet; then
              git commit -m "Add downloaded music"
            else
              echo "No library changes to commit."
            fi

            git push origin main

            echo "Push complete."
          }

          clone_library "$current_repo"

          current_size=$(get_library_size)

          echo ""
          echo "Existing current library size:"
          echo "$current_size bytes"

          while IFS= read -r audio_file || [ -n "$audio_file" ]; do
            if [ -z "$audio_file" ]; then
              continue
            fi

            if [ ! -f "$audio_file" ]; then
              continue
            fi

            file_size=$(stat -c "%s" "$audio_file")
            file_hash=$(md5sum "$audio_file" | awk '{print $1}')

            echo ""
            echo "----------------------------------------"
            echo "File:"
            echo "$audio_file"
            echo "Size:"
            echo "$file_size bytes"
            echo "MD5:"
            echo "$file_hash"
            echo "----------------------------------------"

            if hash_exists "$file_hash"; then
              echo ""
              echo "DUPLICATE"
              echo "An identical MP3 already exists somewhere"
              echo "in the music-library repositories."
              echo "Skipping:"
              echo "$audio_file"

              rm -f "$audio_file"

              continue
            fi

            projected_size=$((current_size + file_size))

            echo ""
            echo "Current library:"
            echo "$current_repo"
            echo "Current size:"
            echo "$current_size bytes"
            echo "Projected size:"
            echo "$projected_size bytes"

            if [ "$current_size" -gt 0 ] && [ "$projected_size" -gt "$LIBRARY_LIMIT_BYTES" ]; then
              echo ""
              echo "900 MiB threshold reached."
              echo "Rolling over."

              push_library "$current_size"

              current_number=$((current_number + 1))

              printf -v current_repo \
                "${LIBRARY_PREFIX}%03d" \
                "$current_number"

              clone_library "$current_repo"

              current_size=$(get_library_size)

              echo ""
              echo "New library:"
              echo "$current_repo"

              projected_size=$((current_size + file_size))
            fi

            relative_path="${audio_file#/tmp/music-downloads/}"
            destination="/tmp/library/$relative_path"

            mkdir -p "$(dirname "$destination")"

            if [ -f "$destination" ]; then
              existing_size=$(stat -c "%s" "$destination")

              if [ "$existing_size" -eq "$file_size" ]; then
                existing_hash=$(md5sum "$destination" | awk '{print $1}')

                if [ "$existing_hash" = "$file_hash" ]; then
                  echo "Identical file already exists at:"
                  echo "$relative_path"

                  rm -f "$audio_file"

                  continue
                fi
              fi

              base="${destination%.mp3}"
              destination="${base} [${current_number}].mp3"
            fi

            cp -p "$audio_file" "$destination"

            printf "%s\n" "$file_hash" \
              >> /tmp/library-hashes.txt

            sort -u /tmp/library-hashes.txt \
              -o /tmp/library-hashes.txt

            current_size=$((current_size + file_size))

            echo ""
            echo "Added:"
            echo "${destination#/tmp/library/}"

          done < <(
            find /tmp/music-downloads \
              -type f \
              -iname "*.mp3" \
              -print |
            sort
          )

          push_library "$current_size"

          echo ""
          echo "========================================"
          echo "LIBRARY COMPLETE"
          echo "========================================"

          echo "Final repository:"
          echo "$current_repo"

          echo "Final size:"
          echo "$current_size bytes"

      - name: Update downloader state
        if: always()
        env:
          GIT_PAT: "${{ secrets.GIT_PAT }}"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sort -u archive.txt -o archive.txt

          git add archive.txt failed.txt

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update download state"

          git remote set-url origin \
            "https://x-access-token:${GIT_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          git pull --rebase origin main
          git push origin main

      - name: Report failures
        if: always()
        run: |
          if [ -f /tmp/had-download-failures ]; then
            if [ "$(cat /tmp/had-download-failures)" = "1" ]; then
              echo ""
              echo "Some tracks failed with all providers."
              echo "They will be retried on the next run."
            fi
          fi

          if [ -s /tmp/resolution-failures.txt ]; then
            echo ""
            echo "Some Spotify URLs could not be resolved:"
            cat /tmp/resolution-failures.txt
          fi

          exit 0