name: Download Spotify Music

on:
  workflow_dispatch:
  push:
    paths:
      - "urls.txt"
      - ".github/workflows/download.yml"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: spotify-music-downloader
  cancel-in-progress: false

permissions:
  contents: write

env:
  LIBRARY_LIMIT_BYTES: "943718400"
  OUTPUT_DIR: /tmp/music-downloads
  QUARANTINE_DIR: /tmp/music-quarantine
  VERIFIED_FILE: /tmp/verified-downloads.txt
  FAILURES_FILE: /tmp/current-run-failures.txt
  RESOLVED_FILE: /tmp/resolved-tracks.jsonl

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout downloader repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Install spotDL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "spotdl==4.5.2"
          spotdl --version

      - name: Install Deno for yt-dlp
        shell: bash
        run: |
          set -euo pipefail

          spotdl --download-deno

          # spotDL installs Deno under ~/.config/spotdl but does not necessarily
          # put that directory on PATH in GitHub Actions.
          DENO_DIR="$HOME/.config/spotdl"

          if [ ! -x "$DENO_DIR/deno" ]; then
            echo "Deno was not installed where spotDL reported: $DENO_DIR/deno"
            ls -la "$DENO_DIR" || true
            exit 1
          fi

          echo "$DENO_DIR" >> "$GITHUB_PATH"
          export PATH="$DENO_DIR:$PATH"

          "$DENO_DIR/deno" --version
          deno --version

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR" "$QUARANTINE_DIR"
          mkdir -p "$OUTPUT_DIR" "$QUARANTINE_DIR"
          : > "$VERIFIED_FILE"
          : > "$FAILURES_FILE"
          : > "$RESOLVED_FILE"

          if [ ! -f urls.txt ]; then
            touch urls.txt
          fi

      - name: Create library push helper
        shell: bash
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${GIT_PAT:-}" ]; then
            echo "GIT_PAT is required."
            exit 1
          fi

          mkdir -p scripts

          cat > scripts/push-source-to-library.sh <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${GIT_PAT:?GIT_PAT is required}"
          : "${SOURCE_ID:?SOURCE_ID is required}"
          : "${VERIFIED_TSV:?VERIFIED_TSV is required}"

          OWNER="donbt256"
          API="https://api.github.com"
          LIBRARY_PREFIX="music-library-"
          LIMIT_BYTES="${LIBRARY_LIMIT_BYTES:-943718400}"
          WORK_ROOT="/tmp/music-library-work"
          HASH_FILE="/tmp/library-hashes.tsv"

          rm -rf "$WORK_ROOT"
          mkdir -p "$WORK_ROOT"
          : > "$HASH_FILE"

          # Authenticate Git non-interactively without placing the PAT in a remote URL.
          ASKPASS="$WORK_ROOT/git-askpass.sh"

          cat > "$ASKPASS" <<'ASKPASS_EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$GIT_PAT" ;;
            *) printf '%s\n' "" ;;
          esac
          ASKPASS_EOF

          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          export GIT_PAT

          api_get() {
            curl -fsSL \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          api_post() {
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$1" \
              --data-binary @-
          }

          repo_exists() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/repos/${OWNER}/$1" | grep -q '^200$'
          }

          ensure_repo() {
            local repo="$1"

            if repo_exists "$repo"; then
              return 0
            fi

            echo "Creating private repository ${OWNER}/${repo}"

            printf '%s\n' \
              "{\"name\":\"${repo}\",\"private\":true,\"has_issues\":false,\"has_projects\":false,\"has_wiki\":false,\"auto_init\":true}" |
              api_post "${API}/user/repos" >/dev/null

            sleep 2
          }

          get_library_repos() {
            local page=1
            local response
            local names=""

            while :; do
              response="$(api_get "${API}/users/${OWNER}/repos?per_page=100&page=${page}&type=all")"

              page_names="$(jq -r --arg prefix "$LIBRARY_PREFIX" '
                .[]
                | select(.name | startswith($prefix))
                | select(.name | test("^music-library-[0-9]{3}$"))
                | .name
              ' <<< "$response")"

              if [ -n "$page_names" ]; then
                names="${names}${page_names}"$'\n'
              fi

              count="$(jq 'length' <<< "$response")"
              [ "$count" -lt 100 ] && break

              page=$((page + 1))
            done

            printf '%s' "$names" |
              sed '/^$/d' |
              sort -V -u
          }

          # GitHub's repository-listing endpoint can lag briefly after repository
          # creation. Do not depend on that listing to discover the first repo:
          # we already know its exact name.
          FIRST_LIBRARY="music-library-001"
          ensure_repo "$FIRST_LIBRARY"

          mapfile -t LIBRARIES < <(get_library_repos)

          # If the API listing has not caught up yet, explicitly verify the known
          # repository and use it directly.
          if [ "${#LIBRARIES[@]}" -eq 0 ]; then
            if repo_exists "$FIRST_LIBRARY"; then
              LIBRARIES=("$FIRST_LIBRARY")
              echo "Repository listing has not caught up; using ${FIRST_LIBRARY} directly."
            else
              echo "Library repository ${OWNER}/${FIRST_LIBRARY} could not be verified."
              exit 1
            fi
          elif ! printf '%s\n' "${LIBRARIES[@]}" | grep -qx "$FIRST_LIBRARY"; then
            if repo_exists "$FIRST_LIBRARY"; then
              LIBRARIES+=("$FIRST_LIBRARY")
              mapfile -t LIBRARIES < <(printf '%s\n' "${LIBRARIES[@]}" | sed '/^$/d' | sort -V -u)
            fi
          fi

          if [ "${#LIBRARIES[@]}" -eq 0 ]; then
            echo "No library repositories available."
            exit 1
          fi

          echo "Library repositories:"
          printf '  %s\n' "${LIBRARIES[@]}"

          # Clone each existing library and build a cross-library MD5 index.
          for repo in "${LIBRARIES[@]}"; do
            dest="${WORK_ROOT}/${repo}"

            echo "Cloning ${repo}"
            rm -rf "$dest"

            git clone --quiet "https://github.com/${OWNER}/${repo}.git" "$dest"

            find "$dest" -type f -iname '*.mp3' -print0 |
              while IFS= read -r -d '' file; do
                rel="${file#"$dest"/}"
                hash="$(md5sum "$file" | awk '{print $1}')"
                printf '%s\t%s\t%s\n' "$hash" "$repo" "$rel" >> "$HASH_FILE"
              done
          done

          # Sort the input so processing is deterministic.
          sort -t $'\t' -k1,1 -o "$HASH_FILE" "$HASH_FILE"

          CURRENT_REPO="${LIBRARIES[${#LIBRARIES[@]}-1]}"
          CURRENT_DIR="${WORK_ROOT}/${CURRENT_REPO}"

          current_size() {
            du -sb "$CURRENT_DIR" | awk '{print $1}'
          }

          new_repo_number() {
            local max=0
            local repo num
            for repo in "${LIBRARIES[@]}"; do
              num="${repo#music-library-}"
              if [ "$((10#$num))" -gt "$max" ]; then
                max="$((10#$num))"
              fi
            done
            printf '%03d' "$((max + 1))"
          }

          create_next_library() {
            local number
            local repo

            number="$(new_repo_number)"
            repo="music-library-${number}"

            ensure_repo "$repo"

            rm -rf "${WORK_ROOT:?}/${repo}"
            git clone --quiet "https://github.com/${OWNER}/${repo}.git" "${WORK_ROOT}/${repo}"

            LIBRARIES+=("$repo")
            CURRENT_REPO="$repo"
            CURRENT_DIR="${WORK_ROOT}/${repo}"

            echo "Rolled over to ${repo}"
          }

          find_hash() {
            local wanted="$1"
            awk -F $'\t' -v h="$wanted" '$1 == h {print; exit}' "$HASH_FILE"
          }

          add_hash() {
            local hash="$1"
            local repo="$2"
            local rel="$3"

            printf '%s\t%s\t%s\n' "$hash" "$repo" "$rel" >> "$HASH_FILE"
            sort -t $'\t' -k1,1 -o "$HASH_FILE" "$HASH_FILE"
          }

          NEW_ARCHIVE="/tmp/source-${SOURCE_ID}-archived.txt"
          : > "$NEW_ARCHIVE"

          while IFS=$'\t' read -r src_path artist album filename expected_md5 spotify_url; do
            [ -n "${src_path:-}" ] || continue

            if [ ! -f "$src_path" ]; then
              echo "Verified file disappeared: $src_path"
              exit 1
            fi

            hash="${expected_md5:-}"
            if [ -z "$hash" ]; then
              hash="$(md5sum "$src_path" | awk '{print $1}')"
            fi

            existing="$(find_hash "$hash" || true)"

            if [ -n "$existing" ]; then
              echo "Exact duplicate already exists: ${src_path}"
              printf '%s\n' "$spotify_url" >> "$NEW_ARCHIVE"
              continue
            fi

            safe_artist="${artist//\//_}"
            safe_artist="${safe_artist//:/_}"
            safe_album="${album//\//_}"
            safe_album="${safe_album//:/_}"

            dest_dir="${CURRENT_DIR}/${safe_artist}/${safe_album}"
            mkdir -p "$dest_dir"

            dest_file="${dest_dir}/${filename}"

            file_size="$(stat -c '%s' "$src_path")"
            used="$(current_size)"

            if [ $((used + file_size)) -gt "$LIMIT_BYTES" ]; then
              git -C "$CURRENT_DIR" status --short

              if [ -n "$(git -C "$CURRENT_DIR" status --porcelain)" ]; then
                git -C "$CURRENT_DIR" add -A
                git -C "$CURRENT_DIR" \
                  -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "Add source ${SOURCE_ID} music"
                git -C "$CURRENT_DIR" push origin HEAD:main
              fi

              create_next_library

              dest_dir="${CURRENT_DIR}/${safe_artist}/${safe_album}"
              mkdir -p "$dest_dir"
              dest_file="${dest_dir}/${filename}"
            fi

            cp "$src_path" "$dest_file"

            rel="${dest_file#"$CURRENT_DIR"/}"
            add_hash "$hash" "$CURRENT_REPO" "$rel"

            printf '%s\n' "$spotify_url" >> "$NEW_ARCHIVE"

            echo "Added:"
            echo "  ${CURRENT_REPO}/${rel}"
          done < "$VERIFIED_TSV"

          # Final transactional push for this source.
          if [ -n "$(git -C "$CURRENT_DIR" status --porcelain)" ]; then
            git -C "$CURRENT_DIR" add -A
            git -C "$CURRENT_DIR" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add source ${SOURCE_ID} music"
            git -C "$CURRENT_DIR" push origin HEAD:main
          fi

          # If we got here, the library transaction succeeded.
          exit 0
          HELPER

          chmod +x scripts/push-source-to-library.sh

      - name: Resolve Spotify metadata with Web API
        shell: bash
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SPOTIFY_CLIENT_ID:-}" ] || [ -z "${SPOTIFY_CLIENT_SECRET:-}" ]; then
            echo "SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET are required."
            exit 1
          fi

          token_response="$(
            curl -fsSL \
              -u "${SPOTIFY_CLIENT_ID}:${SPOTIFY_CLIENT_SECRET}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=client_credentials" \
              https://accounts.spotify.com/api/token \
              < /dev/null
          )"

          spotify_token="$(jq -r '.access_token // empty' <<< "$token_response")"

          if [ -z "$spotify_token" ]; then
            echo "Failed to obtain Spotify API access token."
            echo "$token_response" | jq . 2>/dev/null || true
            exit 1
          fi

          spotify_get() {
            local url="$1"
            local attempt response status

            for attempt in 1 2 3 4 5; do
              response_file="/tmp/spotify-response-${RANDOM}.json"
              status="$(
                curl -sS \
                  -o "$response_file" \
                  -w '%{http_code}' \
                  -H "Authorization: Bearer ${spotify_token}" \
                  "$url" \
                  < /dev/null
              )"

              if [ "$status" = "200" ]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi

              if [ "$status" = "429" ]; then
                retry_after="$(
                  curl -sSI \
                    -H "Authorization: Bearer ${spotify_token}" \
                    "$url" \
                    < /dev/null |
                    awk -F': ' 'tolower($1) == "retry-after" {gsub("\r","",$2); print $2; exit}'
                )"
                retry_after="${retry_after:-5}"
                echo "Spotify API rate limited; waiting ${retry_after}s..." >&2
                rm -f "$response_file"
                sleep "$retry_after"
                continue
              fi

              echo "Spotify API returned HTTP ${status} for ${url}" >&2
              cat "$response_file" >&2 || true
              rm -f "$response_file"
              return 1
            done

            echo "Spotify API request failed after retries: ${url}" >&2
            return 1
          }

          extract_spotify_url() {
            local raw="$1"

            if [[ "$raw" =~ ^https://open\.spotify\.com/(album|track|playlist)/([A-Za-z0-9]+)(\?.*)?$ ]]; then
              printf '%s\n' "$raw" | sed 's/[?].*$//'
              return 0
            fi

            if [[ "$raw" =~ ^spotify:(album|track|playlist):([A-Za-z0-9]+)$ ]]; then
              printf 'https://open.spotify.com/%s/%s\n' "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}"
              return 0
            fi

            return 1
          }

          source_index=0

          while IFS= read -r raw || [ -n "$raw" ]; do
            raw="${raw#"${raw%%[![:space:]]*}"}"
            raw="${raw%"${raw##*[![:space:]]}"}"

            [ -n "$raw" ] || continue
            [[ "$raw" == \#* ]] && continue

            spotify_url="$(extract_spotify_url "$raw" || true)"

            if [ -z "$spotify_url" ]; then
              echo "Unsupported Spotify URL: $raw"
              echo "Skipping this line."
              continue
            fi

            source_index=$((source_index + 1))

            kind="$(sed -nE 's#^https://open\.spotify\.com/([^/]+)/.*#\1#p' <<< "$spotify_url")"
            object_id="$(sed -nE 's#^https://open\.spotify\.com/[^/]+/([^?]+).*#\1#p' <<< "$spotify_url")"

            echo
            echo "=== Resolving Spotify source #${source_index} ==="
            echo "$spotify_url"

            if [ "$kind" = "album" ]; then
              album_json="$(spotify_get "https://api.spotify.com/v1/albums/${object_id}")"

              album_name="$(jq -r '.name // "Unknown Album"' <<< "$album_json")"
              album_artist="$(jq -r '(.artists[0].name // "Unknown Artist")' <<< "$album_json")"
              release_date="$(jq -r '.release_date // ""' <<< "$album_json")"
              total_tracks="$(jq -r '.total_tracks // 0' <<< "$album_json")"
              cover_url="$(jq -r '.images[0].url // ""' <<< "$album_json")"

              offset=0
              while [ "$offset" -lt "$total_tracks" ]; do
                page="$(spotify_get "https://api.spotify.com/v1/albums/${object_id}/tracks?limit=50&offset=${offset}")"

                jq -c \
                  --argjson source_id "$source_index" \
                  --arg source_url "$spotify_url" \
                  --arg album "$album_name" \
                  --arg album_artist "$album_artist" \
                  --arg release_date "$release_date" \
                  --arg cover_url "$cover_url" \
                  --argjson offset "$offset" '
                  .items[]
                  | select(.is_local != true)
                  | {
                      source_id: $source_id,
                      source_url: $source_url,
                      url: (.external_urls.spotify // ("https://open.spotify.com/track/" + .id)),
                      spotify_id: (.id // ""),
                      name: (.name // ""),
                      artist: (.artists[0].name // "Unknown Artist"),
                      artists: ([.artists[]?.name] | map(select(. != null))),
                      album: $album,
                      album_artist: $album_artist,
                      track_number: (.track_number // 1),
                      disc_number: (.disc_number // 1),
                      duration_ms: (.duration_ms // 0),
                      release_date: $release_date,
                      year: (if ($release_date | length) >= 4 then $release_date[0:4] else "" end),
                      genre: "",
                      explicit: (.explicit // false),
                      isrc: (.external_ids.isrc // ""),
                      cover_url: $cover_url,
                      list_name: "",
                      list_url: "",
                      list_position: (($offset + .track_number) // 0),
                      list_length: 0
                    }
                ' <<< "$page" >> "$RESOLVED_FILE"

                page_count="$(jq '.items | length' <<< "$page")"
                offset=$((offset + page_count))

                [ "$page_count" -gt 0 ] || break
              done

              source_count="$(jq -c --argjson id "$source_index" 'select(.source_id == $id)' "$RESOLVED_FILE" | wc -l)"

              echo "Album: ${album_name}"
              echo "Album artist: ${album_artist}"
              echo "Tracks resolved: ${source_count}"

            elif [ "$kind" = "track" ]; then
              track_json="$(spotify_get "https://api.spotify.com/v1/tracks/${object_id}")"

              jq -c \
                --argjson source_id "$source_index" \
                --arg source_url "$spotify_url" '
                select(.is_local != true)
                | {
                    source_id: $source_id,
                    source_url: $source_url,
                    url: (.external_urls.spotify // ("https://open.spotify.com/track/" + .id)),
                    spotify_id: (.id // ""),
                    name: (.name // ""),
                    artist: (.artists[0].name // "Unknown Artist"),
                    artists: ([.artists[]?.name] | map(select(. != null))),
                    album: (.album.name // "Unknown Album"),
                    album_artist: (.album.artists[0].name // .artists[0].name // "Unknown Artist"),
                    track_number: (.track_number // 1),
                    disc_number: (.disc_number // 1),
                    duration_ms: (.duration_ms // 0),
                    release_date: (.album.release_date // ""),
                    year: (if ((.album.release_date // "") | length) >= 4 then .album.release_date[0:4] else "" end),
                    genre: "",
                    explicit: (.explicit // false),
                    isrc: (.external_ids.isrc // ""),
                    cover_url: (.album.images[0].url // ""),
                    list_name: "",
                    list_url: "",
                    list_position: 1,
                    list_length: 1
                  }
              ' <<< "$track_json" >> "$RESOLVED_FILE"

            elif [ "$kind" = "playlist" ]; then
              playlist_json="$(spotify_get "https://api.spotify.com/v1/playlists/${object_id}")"

              playlist_name="$(jq -r '.name // "Spotify Playlist"' <<< "$playlist_json")"

              offset=0
              total_items="$(jq -r '.items.total // 0' <<< "$playlist_json")"

              while [ "$offset" -lt "$total_items" ]; do
                page="$(spotify_get "https://api.spotify.com/v1/playlists/${object_id}/tracks?limit=50&offset=${offset}")"

                jq -c \
                  --argjson source_id "$source_index" \
                  --arg source_url "$spotify_url" \
                  --arg playlist_name "$playlist_name" \
                  --argjson offset "$offset" '
                  .items[]
                  | select(.track != null)
                  | select(.track.type == "track")
                  | select(.track.is_local != true)
                  | .track as $t
                  | {
                      source_id: $source_id,
                      source_url: $source_url,
                      url: ($t.external_urls.spotify // ("https://open.spotify.com/track/" + $t.id)),
                      spotify_id: ($t.id // ""),
                      name: ($t.name // ""),
                      artist: ($t.artists[0].name // "Unknown Artist"),
                      artists: ([$t.artists[]?.name] | map(select(. != null))),
                      album: ($t.album.name // "Unknown Album"),
                      album_artist: ($t.album.artists[0].name // $t.artists[0].name // "Unknown Artist"),
                      track_number: ($t.track_number // 1),
                      disc_number: ($t.disc_number // 1),
                      duration_ms: ($t.duration_ms // 0),
                      release_date: ($t.album.release_date // ""),
                      year: (if (($t.album.release_date // "") | length) >= 4 then $t.album.release_date[0:4] else "" end),
                      genre: "",
                      explicit: ($t.explicit // false),
                      isrc: ($t.external_ids.isrc // ""),
                      cover_url: ($t.album.images[0].url // ""),
                      list_name: $playlist_name,
                      list_url: $source_url,
                      list_position: ($offset + 1),
                      list_length: 0
                    }
                ' <<< "$page" |
                jq -c '.' >> "$RESOLVED_FILE"

                page_count="$(jq '.items | length' <<< "$page")"
                offset=$((offset + page_count))

                [ "$page_count" -gt 0 ] || break
              done

            else
              echo "Unsupported Spotify object type: ${kind}"
              continue
            fi
          done < urls.txt

          total="$(wc -l < "$RESOLVED_FILE")"

          echo
          echo "=== Spotify API resolver summary ==="
          echo "Sources: ${source_index}"
          echo "Tracks:  ${total}"

          if [ "$total" -eq 0 ]; then
            echo "No Spotify tracks were resolved."
            exit 0
          fi

          jq -r '.source_id' "$RESOLVED_FILE" |
            sort -n |
            uniq -c

      - name: Download, validate, tag, and checkpoint each source
        shell: bash
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          total_resolved="$(wc -l < "$RESOLVED_FILE")"

          if [ "$total_resolved" -eq 0 ]; then
            echo "Nothing to download."
            exit 0
          fi

          mapfile -t SOURCE_IDS < <(
            jq -r '.source_id' "$RESOLVED_FILE" |
            sort -n |
            uniq
          )

          for source_id in "${SOURCE_IDS[@]}"; do
            echo
            echo "============================================================"
            echo "Processing Spotify source #${source_id}"
            echo "============================================================"

            source_records="/tmp/source-${source_id}-records.jsonl"
            source_verified="/tmp/source-${source_id}-verified.tsv"
            source_archived="/tmp/source-${source_id}-archived.txt"

            jq -s -c \
              --argjson id "$source_id" \
              'map(select(.source_id == $id))
               | sort_by(.disc_number, .track_number, .list_position)
               | .[]' \
              "$RESOLVED_FILE" > "$source_records"

            : > "$source_verified"
            : > "$source_archived"

            track_count="$(wc -l < "$source_records")"
            track_index=0
            verified_count=0

            while [ "$track_index" -lt "$track_count" ]; do
              track_index=$((track_index + 1))

              # Do not pipe JSON records through stdin to external programs.
              # This prevents spotDL/ffmpeg/yt-dlp from consuming the next record.
              track_record="/tmp/source-${source_id}-track-${track_index}.json"
              jq -c ".[$((track_index - 1))]" \
                < <(jq -s '.' "$source_records") > "$track_record"

              if ! jq -e 'type == "object" and (.url | type == "string")' \
                "$track_record" >/dev/null; then
                echo "Invalid resolved JSON for source #${source_id} track #${track_index}"
                cat "$track_record" || true
                echo "source=${source_id} track=${track_index} reason=invalid-resolved-json" >> "$FAILURES_FILE"
                rm -f "$track_record"
                continue
              fi

              spotify_url="$(jq -r '.url' "$track_record")"
              title="$(jq -r '.name // "Unknown Title"' "$track_record")"
              artist="$(jq -r '.artist // "Unknown Artist"' "$track_record")"
              album="$(jq -r '.album // empty' "$track_record")"
              album_artist="$(jq -r '.album_artist // .artist // empty' "$track_record")"

              if [ -z "$album" ] || [ "$album" = "null" ]; then
                album="Unknown Album"
              fi

              if [ -z "$album_artist" ] || [ "$album_artist" = "null" ]; then
                album_artist="$artist"
              fi
              track_number="$(jq -r '.track_number // 1' "$track_record")"
              disc_number="$(jq -r '.disc_number // 1' "$track_record")"
              duration_ms="$(jq -r '.duration_ms // 0' "$track_record")"
              release_date="$(jq -r '.release_date // ""' "$track_record")"
              year="$(jq -r '.year // ""' "$track_record")"
              genre="$(jq -r '.genre // ""' "$track_record")"
              explicit="$(jq -r '.explicit // false' "$track_record")"
              isrc="$(jq -r '.isrc // ""' "$track_record")"
              cover_url="$(jq -r '.cover_url // ""' "$track_record")"

              if [ "$track_number" -lt 1 ]; then track_number=1; fi
              if [ "$disc_number" -lt 1 ]; then disc_number=1; fi

              echo
              echo "--- Track ${track_index}/${track_count}: ${artist} - ${title} ---"

              safe_title="${title//\//_}"
              safe_title="${safe_title//:/_}"
              safe_artist="${artist//\//_}"
              safe_artist="${safe_artist//:/_}"

              track_tmp="/tmp/track-${source_id}-${track_index}"
              rm -rf "$track_tmp"
              mkdir -p "$track_tmp"

              candidate=""
              provider_succeeded="false"

              for provider in soundcloud bandcamp piped; do
                provider_dir="${track_tmp}/${provider}"
                mkdir -p "$provider_dir"

                echo "Provider: ${provider}"

                if spotdl download "$spotify_url" \
                  --client-id "$SPOTIFY_CLIENT_ID" \
                  --client-secret "$SPOTIFY_CLIENT_SECRET" \
                  --audio "$provider" \
                  --format mp3 \
                  --overwrite force \
                  --output "${provider_dir}/%(title)s.%(output-ext)s" \
                  --print-errors \
                  < /dev/null; then
                  :
                else
                  echo "Provider command failed: ${provider}"
                fi

                candidate="$(find "$provider_dir" -type f -iname '*.mp3' -print -quit || true)"

                if [ -z "$candidate" ]; then
                  echo "No MP3 produced by ${provider}."
                  continue
                fi

                echo "Candidate: ${candidate}"

                codec="$(ffprobe -v error -select_streams a:0 \
                  -show_entries stream=codec_name \
                  -of default=noprint_wrappers=1:nokey=1 \
                  "$candidate" < /dev/null || true)"

                actual_duration="$(ffprobe -v error \
                  -show_entries format=duration \
                  -of default=noprint_wrappers=1:nokey=1 \
                  "$candidate" < /dev/null || true)"

                if [ "$codec" != "mp3" ]; then
                  echo "Rejected: codec is '${codec}', not mp3."
                  mv "$candidate" "$QUARANTINE_DIR/$(basename "$candidate").${provider}.badcodec" || true
                  candidate=""
                  continue
                fi

                if ! awk -v d="${actual_duration:-0}" 'BEGIN { exit !(d > 5) }'; then
                  echo "Rejected: duration is too short."
                  mv "$candidate" "$QUARANTINE_DIR/$(basename "$candidate").${provider}.short" || true
                  candidate=""
                  continue
                fi

                if ! ffmpeg -nostdin -v error -i "$candidate" -f null - </dev/null; then
                  echo "Rejected: FFmpeg decode failed."
                  mv "$candidate" "$QUARANTINE_DIR/$(basename "$candidate").${provider}.decode" || true
                  candidate=""
                  continue
                fi

                if [ "$duration_ms" -gt 0 ]; then
                  expected_seconds="$(awk -v ms="$duration_ms" 'BEGIN { printf "%.3f", ms / 1000 }')"

                  if ! awk -v actual="${actual_duration:-0}" -v expected="$expected_seconds" '
                    BEGIN {
                      diff = actual - expected
                      if (diff < 0) diff = -diff
                      # Allow modest release/encoding/mastering differences:
                      # 8% of expected duration, with a minimum of 15 seconds.
                      tolerance = expected * 0.08
                      if (tolerance < 15) tolerance = 15
                      exit !(diff <= tolerance)
                    }
                  '; then
                    echo "Rejected: duration mismatch."
                    echo "  Expected: ${expected_seconds}s"
                    echo "  Actual:   ${actual_duration}s"
                    mv "$candidate" "$QUARANTINE_DIR/$(basename "$candidate").${provider}.duration" || true
                    candidate=""
                    continue
                  fi
                fi

                provider_succeeded="true"
                echo "Validated download from ${provider}."
                break
              done

              if [ "$provider_succeeded" != "true" ] || [ -z "$candidate" ]; then
                echo "All providers failed for ${artist} - ${title}"
                printf 'source=%s\ttrack=%s\tartist=%s\ttitle=%s\turl=%s\n' \
                  "$source_id" "$track_index" "$artist" "$title" "$spotify_url" \
                  >> "$FAILURES_FILE"
                rm -rf "$track_tmp" "$track_record"
                continue
              fi

              output_dir="${OUTPUT_DIR}/${safe_artist}/${album//\//_}"
              mkdir -p "$output_dir"

              final_file="${output_dir}/$(printf '%02d' "$track_number") - ${safe_title}.mp3"
              work_file="${track_tmp}/final.mp3"

              cp "$candidate" "$work_file"

              # Download Spotify artwork, when available.
              cover_file=""
              if [ -n "$cover_url" ] && [ "$cover_url" != "null" ]; then
                cover_file="${track_tmp}/cover.jpg"
                if curl -fsSL --max-time 30 "$cover_url" -o "$cover_file" < /dev/null; then
                  :
                else
                  rm -f "$cover_file"
                  cover_file=""
                fi
              fi

              ffmpeg_args=(
                -nostdin
                -y
                -v error
                -i "$work_file"
              )

              if [ -n "$cover_file" ]; then
                ffmpeg_args+=(
                  -i "$cover_file"
                  -map 0:a:0
                  -map 1:v:0
                  -c:a copy
                  -c:v mjpeg
                  -disposition:v attached_pic
                )
              else
                ffmpeg_args+=(
                  -map 0:a:0
                  -c:a copy
                )
              fi

              ffmpeg_args+=(
                -metadata "title=${title}"
                -metadata "artist=${artist}"
                -metadata "album=${album}"
                -metadata "album_artist=${album_artist}"
                -metadata "track=${track_number}"
                -metadata "disc=${disc_number}"
              )

              if [ -n "$release_date" ]; then
                ffmpeg_args+=( -metadata "date=${release_date}" )
              elif [ -n "$year" ]; then
                ffmpeg_args+=( -metadata "date=${year}" )
              fi

              if [ -n "$genre" ]; then
                ffmpeg_args+=( -metadata "genre=${genre}" )
              fi

              if [ -n "$isrc" ]; then
                ffmpeg_args+=( -metadata "TSRC=${isrc}" )
              fi

              # Spotify source URL is useful for provenance, but not required for
              # duplicate detection. It is kept as a comment tag only.
              ffmpeg_args+=(
                -metadata "comment=Spotify source: ${spotify_url}"
                "$final_file"
              )

              if ! ffmpeg "${ffmpeg_args[@]}" </dev/null; then
                echo "Metadata/tagging failed for ${artist} - ${title}"
                echo "source=${source_id} track=${track_index} reason=metadata-failed" >> "$FAILURES_FILE"
                rm -f "$final_file"
                rm -rf "$track_tmp" "$track_record"
                continue
              fi

              # Final verification after metadata/artwork processing.
              final_codec="$(ffprobe -v error -select_streams a:0 \
                -show_entries stream=codec_name \
                -of default=noprint_wrappers=1:nokey=1 \
                "$final_file" < /dev/null || true)"

              final_duration="$(ffprobe -v error \
                -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                "$final_file" < /dev/null || true)"

              if [ "$final_codec" != "mp3" ] ||
                 ! awk -v d="${final_duration:-0}" 'BEGIN { exit !(d > 5) }'; then
                echo "Final verification failed for ${final_file}"
                mv "$final_file" "$QUARANTINE_DIR/$(basename "$final_file").final-invalid" || true
                echo "source=${source_id} track=${track_index} reason=final-validation-failed" >> "$FAILURES_FILE"
                rm -rf "$track_tmp" "$track_record"
                continue
              fi

              md5="$(md5sum "$final_file" | awk '{print $1}')"

              # Fields:
              # source file, artist, album, filename, md5, Spotify URL
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$final_file" \
                "$artist" \
                "$album" \
                "$(basename "$final_file")" \
                "$md5" \
                "$spotify_url" \
                >> "$source_verified"

              printf '%s\t%s\t%s\t%s\n' \
                "$source_id" "$track_index" "$final_file" "$spotify_url" \
                >> "$VERIFIED_FILE"

              verified_count=$((verified_count + 1))

              echo "Verified: ${final_file}"

              rm -rf "$track_tmp" "$track_record"
            done

            echo
            echo "Source #${source_id}: ${verified_count}/${track_count} tracks verified."

            # Nothing to push for this source. Failed tracks remain unarchived and
            # will be retried on the next workflow run.
            if [ "$verified_count" -eq 0 ]; then
              echo "No verified tracks for source #${source_id}; skipping library checkpoint."
              continue
            fi

            echo "Checkpointing source #${source_id} into the music library..."

            checkpoint_ok="false"

            for checkpoint_attempt in 1 2 3; do
              echo "Library checkpoint attempt ${checkpoint_attempt}/3"

              if GIT_PAT="$GIT_PAT" \
                SOURCE_ID="$source_id" \
                VERIFIED_TSV="$source_verified" \
                LIBRARY_LIMIT_BYTES="$LIBRARY_LIMIT_BYTES" \
                ./scripts/push-source-to-library.sh < /dev/null; then
                checkpoint_ok="true"
                break
              fi

              if [ "$checkpoint_attempt" -lt 3 ]; then
                echo "Library checkpoint attempt failed; retrying in 5 seconds..."
                sleep 5
              fi
            done

            if [ "$checkpoint_ok" != "true" ]; then
              echo "Library checkpoint failed for source #${source_id} after 3 attempts."
              echo "source=${source_id} reason=library-checkpoint-failed" >> "$FAILURES_FILE"
              continue
            fi

            # Only mark Spotify URLs archived after the library push succeeds.
            if [ -f "$source_archived" ]; then
              cat "$source_archived" >> archive.txt
            fi

            echo "Source #${source_id} checkpoint completed."
          done

      - name: Update downloader state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .state

          if [ -f "$FAILURES_FILE" ]; then
            cat "$FAILURES_FILE" >> .state/failures.txt
          fi

          if [ -f archive.txt ]; then
            cat archive.txt >> .state/archive.txt
          fi

          touch .state/failures.txt .state/archive.txt

          sort -u .state/failures.txt -o .state/failures.txt
          sort -u .state/archive.txt -o .state/archive.txt

          current_failures="/tmp/state-failures.txt"
          current_archive="/tmp/state-archive.txt"

          cp .state/failures.txt "$current_failures"
          cp .state/archive.txt "$current_archive"

          for attempt in 1 2 3 4 5; do
            echo "State update attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p .state
            touch .state/failures.txt .state/archive.txt

            cat "$current_failures" >> .state/failures.txt
            cat "$current_archive" >> .state/archive.txt

            sort -u .state/failures.txt -o .state/failures.txt
            sort -u .state/archive.txt -o .state/archive.txt

            git add .state

            if git diff --cached --quiet; then
              echo "No downloader state changes."
              break
            fi

            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update downloader state"

            if git push origin HEAD:main; then
              echo "Downloader state pushed."
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Failed to push downloader state after 5 attempts."
              exit 1
            fi

            sleep 3
          done

      - name: Show downloaded files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verified downloads ==="
          if [ -s "$VERIFIED_FILE" ]; then
            cat "$VERIFIED_FILE"
          else
            echo "No verified downloads."
          fi

          echo
          echo "=== Current failures ==="
          if [ -s "$FAILURES_FILE" ]; then
            cat "$FAILURES_FILE"
          else
            echo "No failures."
          fi

          echo
          echo "=== Workspace files ==="
          find "$OUTPUT_DIR" -type f -iname '*.mp3' -print 2>/dev/null | sort || true

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          resolved="$(wc -l < "$RESOLVED_FILE" 2>/dev/null || echo 0)"
          verified="$(wc -l < "$VERIFIED_FILE" 2>/dev/null || echo 0)"
          failures="$(wc -l < "$FAILURES_FILE" 2>/dev/null || echo 0)"

          {
            echo "## Spotify downloader"
            echo
            echo "- Resolved tracks: ${resolved}"
            echo "- Verified downloads: ${verified}"
            echo "- Failure records: ${failures}"
            echo
            echo "Provider order: SoundCloud → Bandcamp → Piped"
            echo
            if [ "$failures" -gt 0 ]; then
              echo "### Failures"
              echo '```text'
              cat "$FAILURES_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
