name: Download Spotify Music

on:
  workflow_dispatch:
  push:
    paths:
      - "urls.txt"
      - ".github/workflows/download.yml"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: spotify-music-downloader
  cancel-in-progress: false

permissions:
  contents: write

env:
  LIBRARY_LIMIT_BYTES: "943718400"
  MAX_FILE_BYTES: "100000000"
  OUTPUT_DIR: /tmp/music-downloads
  QUARANTINE_DIR: /tmp/music-quarantine
  VERIFIED_FILE: /tmp/verified-downloads.txt
  FAILURES_FILE: /tmp/current-run-failures.txt
  RESOLVED_FILE: /tmp/resolved-tracks.jsonl

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout downloader repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl

      - name: Install spotDL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "spotdl==4.5.2"
          spotdl --version

      - name: Install Deno for yt-dlp
        shell: bash
        run: |
          set -euo pipefail

          spotdl --download-deno

          DENO_DIR="$HOME/.config/spotdl"

          if [ ! -x "$DENO_DIR/deno" ]; then
            echo "Deno was not installed at $DENO_DIR/deno"
            ls -la "$DENO_DIR" || true
            exit 1
          fi

          echo "$DENO_DIR" >> "$GITHUB_PATH"
          export PATH="$DENO_DIR:$PATH"

          "$DENO_DIR/deno" --version
          deno --version

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$OUTPUT_DIR" "$QUARANTINE_DIR"
          mkdir -p "$OUTPUT_DIR" "$QUARANTINE_DIR"

          : > "$VERIFIED_FILE"
          : > "$FAILURES_FILE"
          : > "$RESOLVED_FILE"

          touch urls.txt

      - name: Create library checkpoint helper
        shell: bash
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          test -n "${GIT_PAT:-}" || {
            echo "GIT_PAT is required."
            exit 1
          }

          mkdir -p scripts

          cat > scripts/push-source-to-library.sh <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${GIT_PAT:?GIT_PAT is required}"
          : "${SOURCE_ID:?SOURCE_ID is required}"
          : "${VERIFIED_TSV:?VERIFIED_TSV is required}"

          OWNER="donbt256"
          API="https://api.github.com"
          PREFIX="music-library-"
          LIMIT_BYTES="${LIBRARY_LIMIT_BYTES:-943718400}"
          MAX_FILE_BYTES="${MAX_FILE_BYTES:-100000000}"
          WORK_ROOT="/tmp/music-library-work"
          HASH_FILE="/tmp/library-hashes.tsv"
          NEW_ARCHIVE="/tmp/source-${SOURCE_ID}-archived.txt"

          rm -rf "$WORK_ROOT"
          mkdir -p "$WORK_ROOT"
          : > "$HASH_FILE"
          : > "$NEW_ARCHIVE"

          ASKPASS="$WORK_ROOT/git-askpass.sh"

          cat > "$ASKPASS" <<'ASKPASS_EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$GIT_PAT" ;;
            *) printf '%s\n' "" ;;
          esac
          ASKPASS_EOF

          chmod 700 "$ASKPASS"

          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          export GIT_PAT

          api_get() {
            curl -fsSL \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          api_post() {
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$1" \
              --data-binary @-
          }

          repo_exists() {
            curl -sS \
              -o /dev/null \
              -w '%{http_code}' \
              -H "Authorization: Bearer ${GIT_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/repos/${OWNER}/$1" |
              grep -q '^200$'
          }

          ensure_repo() {
            local repo="$1"

            if repo_exists "$repo"; then
              return 0
            fi

            echo "Creating private repository ${OWNER}/${repo}"

            printf '%s\n' \
              "{\"name\":\"${repo}\",\"private\":true,\"has_issues\":false,\"has_projects\":false,\"has_wiki\":false,\"auto_init\":true}" |
              api_post "${API}/user/repos" >/dev/null

            sleep 3
          }

          get_library_repos() {
            local page=1
            local response
            local names=""

            while :; do
              response="$(
                api_get \
                  "${API}/users/${OWNER}/repos?per_page=100&page=${page}&type=all"
              )"

              page_names="$(
                jq -r --arg prefix "$PREFIX" '
                  .[]
                  | select(.name | startswith($prefix))
                  | select(.name | test("^music-library-[0-9]{3}$"))
                  | .name
                ' <<< "$response"
              )"

              if [ -n "$page_names" ]; then
                names="${names}${page_names}"$'\n'
              fi

              count="$(jq 'length' <<< "$response")"

              if [ "$count" -lt 100 ]; then
                break
              fi

              page=$((page + 1))
            done

            printf '%s' "$names" |
              sed '/^$/d' |
              sort -V -u
          }

          FIRST_LIBRARY="music-library-001"
          ensure_repo "$FIRST_LIBRARY"

          mapfile -t LIBRARIES < <(get_library_repos)

          if [ "${#LIBRARIES[@]}" -eq 0 ]; then
            if repo_exists "$FIRST_LIBRARY"; then
              LIBRARIES=("$FIRST_LIBRARY")
              echo "Repository listing is delayed; using ${FIRST_LIBRARY} directly."
            else
              echo "Unable to verify ${FIRST_LIBRARY}."
              exit 1
            fi
          elif ! printf '%s\n' "${LIBRARIES[@]}" | grep -qx "$FIRST_LIBRARY"; then
            if repo_exists "$FIRST_LIBRARY"; then
              LIBRARIES+=("$FIRST_LIBRARY")
              mapfile -t LIBRARIES < <(
                printf '%s\n' "${LIBRARIES[@]}" |
                  sed '/^$/d' |
                  sort -V -u
              )
            fi
          fi

          echo "Libraries:"
          printf '  %s\n' "${LIBRARIES[@]}"

          for repo in "${LIBRARIES[@]}"; do
            dest="${WORK_ROOT}/${repo}"

            rm -rf "$dest"
            echo "Cloning ${OWNER}/${repo}"

            git clone --quiet \
              "https://github.com/${OWNER}/${repo}.git" \
              "$dest"

            find "$dest" -type f -iname '*.mp3' -print0 |
              while IFS= read -r -d '' file; do
                rel="${file#"$dest"/}"
                hash="$(md5sum "$file" | awk '{print $1}')"
                printf '%s\t%s\t%s\n' "$hash" "$repo" "$rel" >> "$HASH_FILE"
              done
          done

          sort -t $'\t' -k1,1 -o "$HASH_FILE" "$HASH_FILE"

          CURRENT_REPO="${LIBRARIES[${#LIBRARIES[@]}-1]}"
          CURRENT_DIR="${WORK_ROOT}/${CURRENT_REPO}"

          current_size() {
            find "$CURRENT_DIR" \
              -type f \
              ! -path "$CURRENT_DIR/.git/*" \
              -printf '%s\n' |
              awk '{sum += $1} END {print sum+0}'
          }

          new_repo_number() {
            local max=0
            local repo
            local num

            for repo in "${LIBRARIES[@]}"; do
              num="${repo#music-library-}"

              if [ "$((10#$num))" -gt "$max" ]; then
                max="$((10#$num))"
              fi
            done

            printf '%03d' "$((max + 1))"
          }

          create_next_library() {
            local repo

            repo="music-library-$(new_repo_number)"
            ensure_repo "$repo"

            rm -rf "${WORK_ROOT:?}/${repo}"

            git clone --quiet \
              "https://github.com/${OWNER}/${repo}.git" \
              "${WORK_ROOT}/${repo}"

            LIBRARIES+=("$repo")
            CURRENT_REPO="$repo"
            CURRENT_DIR="${WORK_ROOT}/${repo}"

            echo "Rolled over to ${repo}"
          }

          find_hash() {
            local wanted="$1"
            awk -F $'\t' -v h="$wanted" '$1 == h {print; exit}' "$HASH_FILE"
          }

          add_hash() {
            printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "$HASH_FILE"
            sort -t $'\t' -k1,1 -o "$HASH_FILE" "$HASH_FILE"
          }

          commit_current() {
            if [ -z "$(git -C "$CURRENT_DIR" status --porcelain)" ]; then
              return 0
            fi

            git -C "$CURRENT_DIR" add -A

            git -C "$CURRENT_DIR" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit \
              -m "Add source ${SOURCE_ID} music"

            git -C "$CURRENT_DIR" push origin HEAD:main
          }

          while IFS=$'\t' read -r \
            src_path \
            artist \
            album \
            filename \
            expected_md5 \
            spotify_url; do

            [ -n "${src_path:-}" ] || continue

            if [ ! -f "$src_path" ]; then
              echo "Verified file disappeared: ${src_path}"
              exit 1
            fi

            file_size="$(stat -c '%s' "$src_path")"

            if [ "$file_size" -gt "$MAX_FILE_BYTES" ]; then
              echo "File exceeds individual-file limit:"
              echo "  ${src_path}"
              echo "  ${file_size} bytes"
              echo "  limit: ${MAX_FILE_BYTES} bytes"
              exit 1
            fi

            hash="${expected_md5:-}"

            if [ -z "$hash" ]; then
              hash="$(md5sum "$src_path" | awk '{print $1}')"
            fi

            existing="$(find_hash "$hash" || true)"

            if [ -n "$existing" ]; then
              echo "Exact duplicate already exists: ${src_path}"
              printf '%s\n' "$spotify_url" >> "$NEW_ARCHIVE"
              continue
            fi

            safe_artist="${artist//\//_}"
            safe_artist="${safe_artist//:/_}"
            safe_album="${album//\//_}"
            safe_album="${safe_album//:/_}"

            used="$(current_size)"

            if [ $((used + file_size)) -gt "$LIMIT_BYTES" ]; then
              commit_current
              create_next_library
            fi

            dest_dir="${CURRENT_DIR}/${safe_artist}/${safe_album}"
            mkdir -p "$dest_dir"

            dest_file="${dest_dir}/${filename}"

            cp "$src_path" "$dest_file"

            rel="${dest_file#"$CURRENT_DIR"/}"

            add_hash "$hash" "$CURRENT_REPO" "$rel"
            printf '%s\n' "$spotify_url" >> "$NEW_ARCHIVE"

            echo "Added ${CURRENT_REPO}/${rel}"
          done < "$VERIFIED_TSV"

          commit_current
          HELPER

          chmod +x scripts/push-source-to-library.sh

      - name: Resolve Spotify metadata
        shell: bash
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          test -n "${SPOTIFY_CLIENT_ID:-}" || {
            echo "SPOTIFY_CLIENT_ID is required."
            exit 1
          }

          test -n "${SPOTIFY_CLIENT_SECRET:-}" || {
            echo "SPOTIFY_CLIENT_SECRET is required."
            exit 1
          }

          token_response="$(
            curl -fsSL \
              -u "${SPOTIFY_CLIENT_ID}:${SPOTIFY_CLIENT_SECRET}" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=client_credentials" \
              https://accounts.spotify.com/api/token
          )"

          spotify_token="$(jq -r '.access_token // empty' <<< "$token_response")"

          test -n "$spotify_token" || {
            echo "Unable to obtain Spotify access token."
            exit 1
          }

          spotify_get() {
            local url="$1"
            local attempt
            local response_file
            local status

            for attempt in 1 2 3 4 5; do
              response_file="/tmp/spotify-response-${RANDOM}.json"

              status="$(
                curl -sS \
                  -o "$response_file" \
                  -w '%{http_code}' \
                  -H "Authorization: Bearer ${spotify_token}" \
                  "$url"
              )"

              if [ "$status" = "200" ]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi

              if [ "$status" = "429" ]; then
                retry_after="$(
                  curl -sSI \
                    -H "Authorization: Bearer ${spotify_token}" \
                    "$url" |
                    awk -F': ' '
                      tolower($1) == "retry-after" {
                        gsub("\r", "", $2)
                        print $2
                        exit
                      }
                    '
                )"

                retry_after="${retry_after:-5}"
                rm -f "$response_file"
                sleep "$retry_after"
                continue
              fi

              cat "$response_file" >&2 || true
              rm -f "$response_file"
              return 1
            done

            return 1
          }

          extract_spotify_url() {
            local raw="$1"

            if [[ "$raw" =~ ^https://open\.spotify\.com/(album|track|playlist)/([A-Za-z0-9]+)(\?.*)?$ ]]; then
              printf '%s\n' "$raw" | sed 's/[?].*$//'
              return 0
            fi

            if [[ "$raw" =~ ^spotify:(album|track|playlist):([A-Za-z0-9]+)$ ]]; then
              printf \
                'https://open.spotify.com/%s/%s\n' \
                "${BASH_REMATCH[1]}" \
                "${BASH_REMATCH[2]}"
              return 0
            fi

            return 1
          }

          source_index=0

          while IFS= read -r raw || [ -n "$raw" ]; do
            raw="${raw#"${raw%%[![:space:]]*}"}"
            raw="${raw%"${raw##*[![:space:]]}"}"

            [ -n "$raw" ] || continue
            [[ "$raw" == \#* ]] && continue

            spotify_url="$(extract_spotify_url "$raw" || true)"

            if [ -z "$spotify_url" ]; then
              echo "Skipping unsupported Spotify URL: ${raw}"
              continue
            fi

            source_index=$((source_index + 1))

            kind="$(sed -nE 's#^https://open\.spotify\.com/([^/]+)/.*#\1#p' <<< "$spotify_url")"
            object_id="$(sed -nE 's#^https://open\.spotify\.com/[^/]+/([^?]+).*#\1#p' <<< "$spotify_url")"

            if [ "$kind" = "album" ]; then
              album_json="$(spotify_get "https://api.spotify.com/v1/albums/${object_id}")"

              album_name="$(jq -r '.name // "Unknown Album"' <<< "$album_json")"
              album_artist="$(jq -r '.artists[0].name // "Unknown Artist"' <<< "$album_json")"
              release_date="$(jq -r '.release_date // ""' <<< "$album_json")"
              cover_url="$(jq -r '.images[0].url // ""' <<< "$album_json")"
              total_tracks="$(jq -r '.total_tracks // 0' <<< "$album_json")"

              offset=0

              while [ "$offset" -lt "$total_tracks" ]; do
                page="$(
                  spotify_get \
                    "https://api.spotify.com/v1/albums/${object_id}/tracks?limit=50&offset=${offset}"
                )"

                jq -c \
                  --argjson source_id "$source_index" \
                  --arg source_url "$spotify_url" \
                  --arg album "$album_name" \
                  --arg album_artist "$album_artist" \
                  --arg release_date "$release_date" \
                  --arg cover_url "$cover_url" \
                  --argjson offset "$offset" \
                  --argjson total_tracks "$total_tracks" '
                    .items[]
                    | select(.is_local != true)
                    | {
                        source_id: $source_id,
                        source_url: $source_url,
                        url: (.external_urls.spotify // ("https://open.spotify.com/track/" + .id)),
                        spotify_id: (.id // ""),
                        name: (.name // ""),
                        artist: (.artists[0].name // "Unknown Artist"),
                        artists: [.artists[]?.name],
                        album: $album,
                        album_artist: $album_artist,
                        track_number: (.track_number // 1),
                        disc_number: (.disc_number // 1),
                        duration_ms: (.duration_ms // 0),
                        release_date: $release_date,
                        year: (
                          if ($release_date | length) >= 4
                          then $release_date[0:4]
                          else ""
                          end
                        ),
                        genre: "",
                        explicit: (.explicit // false),
                        isrc: (.external_ids.isrc // ""),
                        cover_url: $cover_url,
                        list_name: "",
                        list_url: "",
                        list_position: ($offset + (.track_number // 1)),
                        list_length: $total_tracks
                      }
                  ' <<< "$page" >> "$RESOLVED_FILE"

                page_count="$(jq '.items | length' <<< "$page")"

                [ "$page_count" -gt 0 ] || break
                offset=$((offset + page_count))
              done

            elif [ "$kind" = "track" ]; then
              track_json="$(spotify_get "https://api.spotify.com/v1/tracks/${object_id}")"

              jq -c \
                --argjson source_id "$source_index" \
                --arg source_url "$spotify_url" '
                  select(.is_local != true)
                  | {
                      source_id: $source_id,
                      source_url: $source_url,
                      url: (.external_urls.spotify // ("https://open.spotify.com/track/" + .id)),
                      spotify_id: (.id // ""),
                      name: (.name // ""),
                      artist: (.artists[0].name // "Unknown Artist"),
                      artists: [.artists[]?.name],
                      album: (.album.name // "Unknown Album"),
                      album_artist: (.album.artists[0].name // .artists[0].name // "Unknown Artist"),
                      track_number: (.track_number // 1),
                      disc_number: (.disc_number // 1),
                      duration_ms: (.duration_ms // 0),
                      release_date: (.album.release_date // ""),
                      year: (
                        if ((.album.release_date // "") | length) >= 4
                        then .album.release_date[0:4]
                        else ""
                        end
                      ),
                      genre: "",
                      explicit: (.explicit // false),
                      isrc: (.external_ids.isrc // ""),
                      cover_url: (.album.images[0].url // ""),
                      list_name: "",
                      list_url: "",
                      list_position: 1,
                      list_length: 1
                    }
                ' <<< "$track_json" >> "$RESOLVED_FILE"

            elif [ "$kind" = "playlist" ]; then
              playlist_json="$(spotify_get "https://api.spotify.com/v1/playlists/${object_id}")"

              playlist_name="$(jq -r '.name // "Spotify Playlist"' <<< "$playlist_json")"
              total_items="$(jq -r '.tracks.total // 0' <<< "$playlist_json")"

              offset=0

              while [ "$offset" -lt "$total_items" ]; do
                page="$(
                  spotify_get \
                    "https://api.spotify.com/v1/playlists/${object_id}/tracks?limit=50&offset=${offset}"
                )"

                jq -c \
                  --argjson source_id "$source_index" \
                  --arg source_url "$spotify_url" \
                  --arg playlist_name "$playlist_name" \
                  --argjson offset "$offset" \
                  --argjson total "$total_items" '
                    .items[]
                    | select(.track != null)
                    | select(.track.type == "track")
                    | select(.track.is_local != true)
                    | .track as $t
                    | {
                        source_id: $source_id,
                        source_url: $source_url,
                        url: ($t.external_urls.spotify // ("https://open.spotify.com/track/" + $t.id)),
                        spotify_id: ($t.id // ""),
                        name: ($t.name // ""),
                        artist: ($t.artists[0].name // "Unknown Artist"),
                        artists: [$t.artists[]?.name],
                        album: ($t.album.name // "Unknown Album"),
                        album_artist: ($t.album.artists[0].name // $t.artists[0].name // "Unknown Artist"),
                        track_number: ($t.track_number // 1),
                        disc_number: ($t.disc_number // 1),
                        duration_ms: ($t.duration_ms // 0),
                        release_date: ($t.album.release_date // ""),
                        year: (
                          if (($t.album.release_date // "") | length) >= 4
                          then $t.album.release_date[0:4]
                          else ""
                          end
                        ),
                        genre: "",
                        explicit: ($t.explicit // false),
                        isrc: ($t.external_ids.isrc // ""),
                        cover_url: ($t.album.images[0].url // ""),
                        list_name: $playlist_name,
                        list_url: $source_url,
                        list_position: ($offset + 1),
                        list_length: $total
                      }
                  ' <<< "$page" >> "$RESOLVED_FILE"

                page_count="$(jq '.items | length' <<< "$page")"

                [ "$page_count" -gt 0 ] || break
                offset=$((offset + page_count))
              done
            fi
          done < urls.txt

          echo "Resolved tracks: $(wc -l < "$RESOLVED_FILE")"

      - name: Download, validate, tag, and checkpoint each source
        shell: bash
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          total_resolved="$(wc -l < "$RESOLVED_FILE")"

          if [ "$total_resolved" -eq 0 ]; then
            echo "Nothing to download."
            exit 0
          fi

          variant_regex='(^|[^[:alnum:]])(cover|covers|remix|remixed|live|acoustic|instrumental|karaoke|nightcore|slowed|sped[ -]?up|reverb|muffled|edit|bootleg|8d)([^[:alnum:]]|$)'

          normalize_text() {
            printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]+/ /g; s/^ +| +$//g'
          }

          contains_variant() {
            normalize_text "$1" | grep -Eiq "$variant_regex"
          }

          valid_soundcloud_url() {
            [[ "$1" =~ ^https://(www\.)?soundcloud\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+([/?#].*)?$ ]]
          }

          quarantine() {
            local file="$1"
            local reason="$2"

            [ -f "$file" ] || return 0

            mv "$file" \
              "$QUARANTINE_DIR/$(basename "$file").${reason}" \
              2>/dev/null || true
          }

          validate_audio() {
            local file="$1"
            local expected_ms="$2"
            local label="$3"

            local codec
            local actual
            local expected

            codec="$(
              ffprobe -v error \
                -select_streams a:0 \
                -show_entries stream=codec_name \
                -of default=noprint_wrappers=1:nokey=1 \
                "$file" < /dev/null || true
            )"

            if [ "$codec" != "mp3" ]; then
              echo "Rejected ${label}: codec=${codec}"
              quarantine "$file" "${label}.badcodec"
              return 1
            fi

            actual="$(
              ffprobe -v error \
                -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                "$file" < /dev/null || true
            )"

            if ! awk -v d="${actual:-0}" 'BEGIN { exit !(d > 5) }'; then
              echo "Rejected ${label}: duration too short"
              quarantine "$file" "${label}.short"
              return 1
            fi

            if ! ffmpeg -nostdin -v error -i "$file" -f null - </dev/null; then
              echo "Rejected ${label}: decode failed"
              quarantine "$file" "${label}.decode"
              return 1
            fi

            if [ "${expected_ms:-0}" -gt 0 ]; then
              expected="$(awk -v ms="$expected_ms" 'BEGIN { printf "%.3f", ms / 1000 }')"

              if ! awk \
                -v actual="${actual:-0}" \
                -v expected="$expected" '
                BEGIN {
                  difference = actual - expected
                  if (difference < 0) difference = -difference

                  tolerance = expected * 0.08
                  if (tolerance < 15) tolerance = 15

                  exit !(difference <= tolerance)
                }
              '; then
                echo "Rejected ${label}: duration mismatch"
                echo "Expected: ${expected}s"
                echo "Actual:   ${actual}s"
                quarantine "$file" "${label}.duration"
                return 1
              fi
            fi

            return 0
          }

          provider_has_bad_metadata() {
            local file="$1"
            local log="$2"
            local metadata

            metadata="$(
              {
                basename "$file"
                ffprobe -v error \
                  -show_entries format_tags=title,artist,album \
                  -of default=noprint_wrappers=1:nokey=0 \
                  "$file" 2>/dev/null || true
                cat "$log" 2>/dev/null || true
              }
            )"

            contains_variant "$metadata"
          }

          mapfile -t SOURCE_IDS < <(
            jq -r '.source_id' "$RESOLVED_FILE" |
              sort -n |
              uniq
          )

          for source_id in "${SOURCE_IDS[@]}"; do
            source_records="/tmp/source-${source_id}-records.jsonl"
            source_verified="/tmp/source-${source_id}-verified.tsv"
            source_archived="/tmp/source-${source_id}-archived.txt"

            jq -s -c \
              --argjson id "$source_id" '
                map(select(.source_id == $id))
                | sort_by(.disc_number, .track_number, .list_position)
                | .[]
              ' "$RESOLVED_FILE" > "$source_records"

            : > "$source_verified"
            : > "$source_archived"

            track_count="$(wc -l < "$source_records")"
            track_index=0
            verified_count=0

            while [ "$track_index" -lt "$track_count" ]; do
              track_index=$((track_index + 1))

              track_record="/tmp/source-${source_id}-track-${track_index}.json"

              jq -c ".[$((track_index - 1))]" \
                < <(jq -s '.' "$source_records") \
                > "$track_record"

              spotify_url="$(jq -r '.url' "$track_record")"
              title="$(jq -r '.name // "Unknown Title"' "$track_record")"
              artist="$(jq -r '.artist // "Unknown Artist"' "$track_record")"
              album="$(jq -r '.album // "Unknown Album"' "$track_record")"
              album_artist="$(jq -r '.album_artist // .artist' "$track_record")"
              track_number="$(jq -r '.track_number // 1' "$track_record")"
              disc_number="$(jq -r '.disc_number // 1' "$track_record")"
              duration_ms="$(jq -r '.duration_ms // 0' "$track_record")"
              release_date="$(jq -r '.release_date // ""' "$track_record")"
              year="$(jq -r '.year // ""' "$track_record")"
              genre="$(jq -r '.genre // ""' "$track_record")"
              isrc="$(jq -r '.isrc // ""' "$track_record")"
              cover_url="$(jq -r '.cover_url // ""' "$track_record")"

              echo
              echo "--- Track ${track_index}/${track_count}: ${artist} - ${title} ---"

              safe_title="${title//\//_}"
              safe_title="${safe_title//:/_}"
              safe_artist="${artist//\//_}"
              safe_artist="${safe_artist//:/_}"
              safe_album="${album//\//_}"
              safe_album="${safe_album//:/_}"

              track_tmp="/tmp/track-${source_id}-${track_index}"
              rm -rf "$track_tmp"
              mkdir -p "$track_tmp"

              candidate=""
              provider_succeeded="false"

              #
              # SoundCloud structured search
              #
              soundcloud_dir="${track_tmp}/soundcloud"
              mkdir -p "$soundcloud_dir"

              raw_jsonl="${soundcloud_dir}/search.jsonl"
              candidates_jsonl="${soundcloud_dir}/candidates.jsonl"

              soundcloud_query="${artist} ${title}"

              echo "Searching SoundCloud: ${soundcloud_query}"

              yt-dlp \
                "scsearch50:${soundcloud_query}" \
                --flat-playlist \
                --dump-json \
                --skip-download \
                --no-warnings \
                > "$raw_jsonl" \
                2> "${soundcloud_dir}/search.log" || true

              if [ -s "$raw_jsonl" ]; then
                if ! jq -s -c \
                  --arg wanted_title "$title" \
                  --arg wanted_artist "$artist" \
                  --argjson expected_ms "${duration_ms:-0}" '
                  def search_entries:
                    if type == "object" and (.entries? | type) == "array"
                    then .entries[] | search_entries
                    else .
                    end;

                  def soundcloud_permalink:
                    type == "string"
                    and test("^https://(www\\.)?soundcloud\\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+([/?#].*)?$");

                  def norm:
                    ascii_downcase
                    | gsub("[^a-z0-9]+"; " ")
                    | gsub("^ +| +$"; "");

                  def bad_variant:
                    test(
                      "(^|[^a-z0-9])(cover|covers|remix|remixed|live|acoustic|instrumental|karaoke|nightcore|slowed|slowed[ ]*\\+[ ]*reverb|sped[ -]?up|reverb|muffled|edit|bootleg|8d)([^a-z0-9]|$)";
                      "i"
                    );

                  [
                    .[]
                    | search_entries
                    | . as $item
                    | ($item.webpage_url // $item.original_url // null) as $url
                    | (($item.title // "") | tostring) as $candidate_title
                    | (($item.uploader // $item.channel // "") | tostring) as $uploader
                    | select($url | soundcloud_permalink)
                    | select((($candidate_title + " " + $url) | bad_variant) | not)
                    | ($candidate_title | norm) as $ct
                    | ($wanted_title | norm) as $wt
                    | ($uploader | norm) as $up
                    | ($wanted_artist | norm) as $wa
                    | (
                        (if $ct == $wt then 100 else 0 end)
                        + (if ($ct | contains($wt)) then 35 else 0 end)
                        + (if ($ct | contains($wa)) then 20 else 0 end)
                        + (if ($up | contains($wa)) then 30 else 0 end)
                        + (
                            if (($item.duration // 0) > 0 and $expected_ms > 0)
                            then
                              (
                                (($item.duration * 1000) - $expected_ms)
                                | if . < 0 then - . else . end
                              )
                              | if . <= 15000 then 25
                                elif . <= ($expected_ms * 0.08) then 15
                                else 0
                                end
                            else 0
                            end
                          )
                      ) as $score
                    | {
                        url: $url,
                        title: $candidate_title,
                        uploader: $uploader,
                        duration: ($item.duration // 0),
                        score: $score
                      }
                  ]
                  | sort_by(-.score, .title, .url)
                  | .[]
                ' "$raw_jsonl" > "$candidates_jsonl"; then
                  echo "Unable to parse structured SoundCloud search results." \
                    | tee -a "${soundcloud_dir}/search.log" >&2
                  : > "$candidates_jsonl"
                fi
              fi

              if [ -s "$candidates_jsonl" ]; then
                candidate_number=0

                while IFS= read -r candidate_json; do
                  soundcloud_url="$(jq -r '.url // empty' <<< "$candidate_json")"
                  soundcloud_title="$(jq -r '.title // empty' <<< "$candidate_json")"
                  soundcloud_uploader="$(jq -r '.uploader // empty' <<< "$candidate_json")"

                  [ -n "$soundcloud_url" ] || continue

                  if ! valid_soundcloud_url "$soundcloud_url"; then
                    echo "Skipping malformed SoundCloud URL: ${soundcloud_url}"
                    continue
                  fi

                  candidate_number=$((candidate_number + 1))
                  candidate_dir="${soundcloud_dir}/candidate-${candidate_number}"
                  mkdir -p "$candidate_dir"

                  echo
                  echo "SoundCloud candidate ${candidate_number}: ${soundcloud_title}"
                  echo "Uploader: ${soundcloud_uploader}"
                  echo "URL: ${soundcloud_url}"

                  if yt-dlp \
                    "$soundcloud_url" \
                    --extract-audio \
                    --audio-format mp3 \
                    --audio-quality 0 \
                    --no-playlist \
                    --no-warnings \
                    --output "${candidate_dir}/%(title)s.%(ext)s" \
                    > "${candidate_dir}/stdout.log" \
                    2> "${candidate_dir}/yt-dlp.log"; then
                    :
                  else
                    echo "SoundCloud download failed."
                  fi

                  candidate="$(
                    find "$candidate_dir" \
                      -type f \
                      -iname '*.mp3' \
                      -print \
                      -quit
                  )"

                  [ -n "$candidate" ] || continue

                  if contains_variant "${soundcloud_title} ${soundcloud_url}"; then
                    echo "Rejected SoundCloud variant."
                    quarantine "$candidate" "soundcloud.variant"
                    candidate=""
                    continue
                  fi

                  if validate_audio \
                    "$candidate" \
                    "$duration_ms" \
                    "soundcloud-candidate-${candidate_number}"; then
                    provider_succeeded="true"
                    echo "Validated SoundCloud candidate ${candidate_number}."
                    break
                  fi

                  candidate=""
                done < "$candidates_jsonl"
              fi

              #
              # Bandcamp, then Piped
              #
              if [ "$provider_succeeded" != "true" ]; then
                for provider in bandcamp piped; do
                  provider_dir="${track_tmp}/${provider}"
                  mkdir -p "$provider_dir"

                  provider_log="${provider_dir}/spotdl.log"

                  echo
                  echo "Provider: ${provider}"

                  spotdl download "$spotify_url" \
                    --client-id "$SPOTIFY_CLIENT_ID" \
                    --client-secret "$SPOTIFY_CLIENT_SECRET" \
                    --audio "$provider" \
                    --format mp3 \
                    --overwrite force \
                    --output "${provider_dir}/%(title)s.%(output-ext)s" \
                    --print-errors \
                    < /dev/null \
                    > "$provider_log" \
                    2>&1 || true

                  candidate="$(
                    find "$provider_dir" \
                      -type f \
                      -iname '*.mp3' \
                      -print \
                      -quit
                  )"

                  if [ -z "$candidate" ]; then
                    echo "No MP3 produced by ${provider}."
                    continue
                  fi

                  if grep -Eiq \
                    'https?://[^[:space:]]*(cover|remix|live|acoustic|instrumental|karaoke|nightcore|slowed|sped[- ]?up|reverb|muffled|edit|bootleg|8d)' \
                    "$provider_log"; then
                    echo "Rejected ${provider}: unwanted provider URL."
                    quarantine "$candidate" "${provider}.variant-url"
                    candidate=""
                    continue
                  fi

                  if provider_has_bad_metadata "$candidate" "$provider_log"; then
                    echo "Rejected ${provider}: unwanted metadata."
                    quarantine "$candidate" "${provider}.variant-metadata"
                    candidate=""
                    continue
                  fi

                  if validate_audio "$candidate" "$duration_ms" "$provider"; then
                    provider_succeeded="true"
                    echo "Validated download from ${provider}."
                    break
                  fi

                  candidate=""
                done
              fi

              if [ "$provider_succeeded" != "true" ] || [ -z "$candidate" ]; then
                echo "All providers failed for ${artist} - ${title}"

                printf 'source=%s\ttrack=%s\tartist=%s\ttitle=%s\turl=%s\n' \
                  "$source_id" \
                  "$track_index" \
                  "$artist" \
                  "$title" \
                  "$spotify_url" \
                  >> "$FAILURES_FILE"

                rm -rf "$track_tmp" "$track_record"
                continue
              fi

              output_dir="${OUTPUT_DIR}/${safe_artist}/${safe_album}"
              mkdir -p "$output_dir"

              final_file="${output_dir}/$(printf '%02d' "$track_number") - ${safe_title}.mp3"
              work_file="${track_tmp}/final.mp3"

              cp "$candidate" "$work_file"

              cover_file=""

              if [ -n "$cover_url" ] && [ "$cover_url" != "null" ]; then
                cover_file="${track_tmp}/cover.jpg"

                curl -fsSL \
                  --max-time 30 \
                  "$cover_url" \
                  -o "$cover_file" \
                  < /dev/null || {
                    rm -f "$cover_file"
                    cover_file=""
                  }
              fi

              ffmpeg_args=(
                -nostdin
                -y
                -v error
                -i "$work_file"
              )

              if [ -n "$cover_file" ]; then
                ffmpeg_args+=(
                  -i "$cover_file"
                  -map 0:a:0
                  -map 1:v:0
                  -c:a copy
                  -c:v mjpeg
                  -disposition:v attached_pic
                )
              else
                ffmpeg_args+=(
                  -map 0:a:0
                  -c:a copy
                )
              fi

              ffmpeg_args+=(
                -metadata "title=${title}"
                -metadata "artist=${artist}"
                -metadata "album=${album}"
                -metadata "album_artist=${album_artist}"
                -metadata "track=${track_number}"
                -metadata "disc=${disc_number}"
              )

              if [ -n "$release_date" ]; then
                ffmpeg_args+=(-metadata "date=${release_date}")
              elif [ -n "$year" ]; then
                ffmpeg_args+=(-metadata "date=${year}")
              fi

              [ -n "$genre" ] && ffmpeg_args+=(-metadata "genre=${genre}")
              [ -n "$isrc" ] && ffmpeg_args+=(-metadata "TSRC=${isrc}")

              ffmpeg_args+=(
                -metadata "comment=Spotify source: ${spotify_url}"
                "$final_file"
              )

              if ! ffmpeg "${ffmpeg_args[@]}" </dev/null; then
                echo "Tagging failed for ${artist} - ${title}"
                echo "source=${source_id} track=${track_index} reason=metadata-failed" \
                  >> "$FAILURES_FILE"
                rm -f "$final_file"
                rm -rf "$track_tmp" "$track_record"
                continue
              fi

              final_codec="$(
                ffprobe -v error \
                  -select_streams a:0 \
                  -show_entries stream=codec_name \
                  -of default=noprint_wrappers=1:nokey=1 \
                  "$final_file" < /dev/null || true
              )"

              final_duration="$(
                ffprobe -v error \
                  -show_entries format=duration \
                  -of default=noprint_wrappers=1:nokey=1 \
                  "$final_file" < /dev/null || true
              )"

              if [ "$final_codec" != "mp3" ] ||
                 ! awk -v d="${final_duration:-0}" 'BEGIN { exit !(d > 5) }'; then
                echo "Final validation failed: ${final_file}"
                quarantine "$final_file" "final-invalid"
                echo "source=${source_id} track=${track_index} reason=final-validation-failed" \
                  >> "$FAILURES_FILE"
                rm -rf "$track_tmp" "$track_record"
                continue
              fi

              md5="$(md5sum "$final_file" | awk '{print $1}')"

              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$final_file" \
                "$artist" \
                "$album" \
                "$(basename "$final_file")" \
                "$md5" \
                "$spotify_url" \
                >> "$source_verified"

              printf '%s\t%s\t%s\t%s\n' \
                "$source_id" \
                "$track_index" \
                "$final_file" \
                "$spotify_url" \
                >> "$VERIFIED_FILE"

              verified_count=$((verified_count + 1))

              echo "Verified: ${final_file}"

              rm -rf "$track_tmp" "$track_record"
            done

            echo
            echo "Source #${source_id}: ${verified_count}/${track_count} tracks verified."

            if [ "$verified_count" -eq 0 ]; then
              echo "No verified tracks; skipping checkpoint."
              continue
            fi

            checkpoint_ok="false"

            for attempt in 1 2 3; do
              echo "Library checkpoint attempt ${attempt}/3"

              if GIT_PAT="$GIT_PAT" \
                SOURCE_ID="$source_id" \
                VERIFIED_TSV="$source_verified" \
                LIBRARY_LIMIT_BYTES="$LIBRARY_LIMIT_BYTES" \
                MAX_FILE_BYTES="$MAX_FILE_BYTES" \
                ./scripts/push-source-to-library.sh < /dev/null; then
                checkpoint_ok="true"
                break
              fi

              [ "$attempt" -lt 3 ] && sleep 5
            done

            if [ "$checkpoint_ok" != "true" ]; then
              echo "Library checkpoint failed for source ${source_id}."
              echo "source=${source_id} reason=library-checkpoint-failed" \
                >> "$FAILURES_FILE"
              continue
            fi

            if [ -f "$source_archived" ]; then
              cat "$source_archived" >> archive.txt
            fi

            echo "Source ${source_id} checkpoint completed."
          done

      - name: Update downloader state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .state
          touch .state/failures.txt .state/archive.txt

          cat "$FAILURES_FILE" >> .state/failures.txt || true
          cat archive.txt >> .state/archive.txt || true

          sort -u .state/failures.txt -o .state/failures.txt
          sort -u .state/archive.txt -o .state/archive.txt

          saved_failures="/tmp/saved-failures.txt"
          saved_archive="/tmp/saved-archive.txt"

          cp .state/failures.txt "$saved_failures"
          cp .state/archive.txt "$saved_archive"

          for attempt in 1 2 3 4 5; do
            echo "State update attempt ${attempt}/5"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p .state
            touch .state/failures.txt .state/archive.txt

            cat "$saved_failures" >> .state/failures.txt
            cat "$saved_archive" >> .state/archive.txt

            sort -u .state/failures.txt -o .state/failures.txt
            sort -u .state/archive.txt -o .state/archive.txt

            git add .state

            if git diff --cached --quiet; then
              echo "No state changes."
              break
            fi

            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit \
              -m "Update downloader state"

            if git push origin HEAD:main; then
              echo "Downloader state pushed."
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Unable to push downloader state."
              exit 1
            fi

            sleep 3
          done

      - name: Show results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Verified downloads ==="
          cat "$VERIFIED_FILE" 2>/dev/null || true

          echo
          echo "=== Current failures ==="
          cat "$FAILURES_FILE" 2>/dev/null || true

          echo
          echo "=== Downloaded files ==="
          find "$OUTPUT_DIR" \
            -type f \
            -iname '*.mp3' \
            -print \
            2>/dev/null |
            sort || true

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          resolved="$(wc -l < "$RESOLVED_FILE" 2>/dev/null || echo 0)"
          verified="$(wc -l < "$VERIFIED_FILE" 2>/dev/null || echo 0)"
          failures="$(wc -l < "$FAILURES_FILE" 2>/dev/null || echo 0)"

          {
            echo "## Spotify downloader"
            echo
            echo "- Resolved tracks: ${resolved}"
            echo "- Verified downloads: ${verified}"
            echo "- Failure records: ${failures}"
            echo
            echo "Provider order: SoundCloud → Bandcamp → Piped"
            echo "SoundCloud candidates: structured JSONL, ranked and variant-filtered"
            echo

            if [ "$failures" -gt 0 ]; then
              echo "### Failures"
              echo '```text'
              cat "$FAILURES_FILE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
