name: Download Spotify Music

on:
  workflow_dispatch:
  push:
    paths:
      - "urls.txt"
      - ".github/workflows/download.yml"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: spotify-music-downloader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    env:
      LIBRARY_LIMIT_BYTES: 943718400
      OUTPUT_DIR: /tmp/music-downloads
      QUARANTINE_DIR: /tmp/music-quarantine
      VERIFIED_FILE: /tmp/verified-downloads.txt
      FAILURES_FILE: /tmp/current-run-failures.txt
      RESOLVED_FILE: /tmp/resolved-tracks.tsv

    steps:
      - name: Check out downloader
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Install spotDL
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "spotdl==4.5.2"

      - name: Install Deno
        run: |
          set -euo pipefail
          spotdl --download-deno

      - name: Prepare directories
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR" "$QUARANTINE_DIR"
          mkdir -p "$OUTPUT_DIR" "$QUARANTINE_DIR"
          : > "$VERIFIED_FILE"
          : > "$FAILURES_FILE"
          : > "$RESOLVED_FILE"

      # Tier 1:
      # - per-source processing/checkpoints
      # - Spotify metadata as the canonical metadata source
      # - mandatory track/disc numbering
      # - provider fallback
      # - audio validation and Spotify-duration verification
      # - quarantine of suspicious downloads
      # - cross-library MD5 duplicate detection
      # - archive only after the corresponding library push succeeds
      #
      # This resolver creates a source manifest. Each input URL is processed
      # independently so a completed album/playlist can be committed and pushed
      # before the next one begins.
      - name: Resolve Spotify sources
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [[ ! -f urls.txt ]]; then
            echo "urls.txt not found."
            exit 1
          fi

          source_index=0

          while IFS= read -r raw || [[ -n "$raw" ]]; do
            raw="${raw#"${raw%%[![:space:]]*}"}"
            raw="${raw%"${raw##*[![:space:]]}"}"

            [[ -z "$raw" ]] && continue
            [[ "$raw" == \#* ]] && continue

            source_index=$((source_index + 1))

            source_file="/tmp/source-${source_index}.txt"
            source_url="$raw"

            echo "========================================"
            echo "Resolving source #$source_index"
            echo "$source_url"
            echo "========================================"

            # spotDL's save command gives us Spotify's canonical track data.
            # The JSON is retained for the processing step below.
            if ! spotdl save "$source_url" \
                --client-id "$SPOTIFY_CLIENT_ID" \
                --client-secret "$SPOTIFY_CLIENT_SECRET" \
                --save-file "$source_file.json"; then
              echo "Could not resolve: $source_url" | tee -a "$FAILURES_FILE"
              continue
            fi

            jq -c \
              --arg source_id "$source_index" \
              --arg source_url "$source_url" \
              '
              if type == "array" then . else [.] end
              | .[]
              | {
                  source_id: $source_id,
                  source_url: $source_url,
                  url: (.url // .spotify_url // ""),
                  name: (.name // .title // ""),
                  artist: (
                    if (.artists | type) == "array"
                    then (.artists | map(
                      if type == "object" then (.name // "")
                      else tostring
                      end
                    ) | join(", "))
                    else (.artist // .artists // "")
                    end
                  ),
                  album: (
                    if (.album | type) == "object"
                    then (.album.name // "")
                    else (.album // "")
                    end
                  ),
                  album_artist: (
                    .album_artist //
                    (if (.album | type) == "object"
                     then (.album.artists // [] | map(
                       if type == "object" then (.name // "")
                       else tostring
                       end
                     ) | join(", "))
                     else ""
                     end)
                  ),
                  track_number: (
                    .track_number //
                    (.track_number_total | if . == null then null else 1 end)
                  ),
                  disc_number: (.disc_number // 1),
                  duration_ms: (.duration_ms // .duration // null),
                  release_date: (
                    .release_date //
                    (if (.album | type) == "object"
                     then (.album.release_date // "")
                     else ""
                     end)
                  ),
                  year: (.year // ""),
                  genre: (
                    if (.genres | type) == "array"
                    then (.genres | join(", "))
                    else (.genre // "")
                    end
                  ),
                  explicit: (.explicit // false),
                  isrc: (.external_ids.isrc // .isrc // ""),
                  cover_url: (
                    .cover_url //
                    .album_cover_url //
                    .image //
                    .images[0].url //
                    (if (.album | type) == "object"
                     then .album.images[0].url
                     else ""
                     end)
                  )
                }
              | select(.url != "")
              | @json
              ' "$source_file.json" 2>/dev/null |
              while IFS= read -r record; do
                printf '%s\t%s\n' "$source_index" "$record" >> "$RESOLVED_FILE"
              done

          done < urls.txt

          echo
          echo "Resolved source/track records:"
          wc -l "$RESOLVED_FILE" || true

      - name: Process each Spotify source
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [[ ! -s "$RESOLVED_FILE" ]]; then
            echo "No tracks were resolved."
            exit 0
          fi

          # Extract source IDs in their original order.
          mapfile -t SOURCE_IDS < <(cut -f1 "$RESOLVED_FILE" | awk '!seen[$0]++')

          for source_id in "${SOURCE_IDS[@]}"; do
            echo
            echo "############################################################"
            echo "Processing Spotify source #$source_id"
            echo "############################################################"

            source_records="/tmp/source-${source_id}-records.tsv"
            source_failures="/tmp/source-${source_id}-failures.txt"
            source_verified="/tmp/source-${source_id}-verified.tsv"
            source_staged="/tmp/source-${source_id}-staged.tsv"

            : > "$source_records"
            : > "$source_failures"
            : > "$source_verified"
            : > "$source_staged"

            awk -F '\t' -v id="$source_id" '$1 == id {print $2}' \
              "$RESOLVED_FILE" > "$source_records"

            track_index=0

            while IFS= read -r record; do
              [[ -z "$record" ]] && continue

              track_index=$((track_index + 1))

              spotify_url="$(jq -r '.url' <<< "$record")"
              title="$(jq -r '.name' <<< "$record")"
              artist="$(jq -r '.artist' <<< "$record")"
              album="$(jq -r '.album' <<< "$record")"
              album_artist="$(jq -r '.album_artist' <<< "$record")"
              track_number="$(jq -r '.track_number // 1' <<< "$record")"
              disc_number="$(jq -r '.disc_number // 1' <<< "$record")"
              duration_ms="$(jq -r '.duration_ms // 0' <<< "$record")"
              release_date="$(jq -r '.release_date // ""' <<< "$record")"
              year="$(jq -r '.year // ""' <<< "$record")"
              genre="$(jq -r '.genre // ""' <<< "$record")"
              explicit="$(jq -r '.explicit // false' <<< "$record")"
              isrc="$(jq -r '.isrc // ""' <<< "$record")"
              cover_url="$(jq -r '.cover_url // ""' <<< "$record")"

              expected_seconds="0"
              if [[ "$duration_ms" =~ ^[0-9]+$ ]] && (( duration_ms > 0 )); then
                expected_seconds="$(awk -v ms="$duration_ms" 'BEGIN {printf "%.3f", ms/1000}')"
              fi

              safe_artist="$(printf '%s' "$artist" | tr '/:' '__')"
              safe_album="$(printf '%s' "$album" | tr '/:' '__')"
              safe_title="$(printf '%s' "$title" | tr '/:' '__')"

              output_base="$OUTPUT_DIR/$safe_artist/$safe_album"
              mkdir -p "$output_base"

              echo
              echo "Track $track_index"
              echo "Spotify: $spotify_url"
              echo "Canonical: $artist - $album - $title"

              providers=("soundcloud" "bandcamp" "piped")
              downloaded=""

              for provider in "${providers[@]}"; do
                echo "Trying provider: $provider"

                provider_log="/tmp/provider-${source_id}-${track_index}-${provider}.log"

                set +e
                spotdl download "$spotify_url" \
                  --client-id "$SPOTIFY_CLIENT_ID" \
                  --client-secret "$SPOTIFY_CLIENT_SECRET" \
                  --audio "$provider" \
                  --output "$output_base/{track-number} - {title}.{output-ext}" \
                  > >(tee "$provider_log") 2>&1
                provider_status=$?
                set -e

                if (( provider_status != 0 )); then
                  echo "Provider failed: $provider"

                  if grep -Eiq \
                    'DRM|protected|unavailable|no results|not found|does not exist|removed|private track|deleted' \
                    "$provider_log"; then
                    classification="permanent"
                  elif grep -Eiq \
                    '429|rate.?limit|timed out|timeout|temporar|5[0-9][0-9]|connection|network|503|502|504' \
                    "$provider_log"; then
                    classification="transient"
                  else
                    classification="unknown"
                  fi

                  printf '%s | source=%s | track=%s | provider=%s | class=%s | reason=provider failure\n' \
                    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    "$spotify_url" \
                    "$title" \
                    "$provider" \
                    "$classification" >> "$source_failures"

                  continue
                fi

                candidate="$(find "$output_base" -maxdepth 1 -type f -iname '*.mp3' -printf '%T@ %p\n' \
                  | sort -nr | head -n1 | cut -d' ' -f2- || true)"

                if [[ -z "$candidate" || ! -f "$candidate" ]]; then
                  echo "Provider returned success but no MP3 was found."
                  continue
                fi

                # Tier 1 audio validation:
                # 1. ffprobe must identify an audio stream.
                # 2. Duration must be sane.
                # 3. ffmpeg must be able to decode the file without errors.
                codec="$(ffprobe -v error -select_streams a:0 \
                  -show_entries stream=codec_name \
                  -of default=noprint_wrappers=1:nokey=1 "$candidate" 2>/dev/null || true)"

                actual_seconds="$(ffprobe -v error \
                  -show_entries format=duration \
                  -of default=noprint_wrappers=1:nokey=1 "$candidate" 2>/dev/null || true)"

                if [[ "$codec" != "mp3" ]] || [[ -z "$actual_seconds" ]]; then
                  echo "Invalid audio file; quarantining."
                  mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")" || true
                  continue
                fi

                if ! awk -v d="$actual_seconds" 'BEGIN {exit !(d > 5)}'; then
                  echo "Audio is suspiciously short; quarantining."
                  mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")" || true
                  continue
                fi

                if ! ffmpeg -v error -i "$candidate" -f null - >/tmp/ffmpeg-check.log 2>&1; then
                  echo "Audio failed full decode validation; quarantining."
                  mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")" || true
                  continue
                fi

                # Compare the provider's duration against Spotify's expected duration.
                # Allow a small absolute tolerance and a small percentage tolerance
                # to account for intro/outro and encoding differences.
                if [[ "$expected_seconds" != "0" ]]; then
                  duration_ok="$(
                    awk -v expected="$expected_seconds" -v actual="$actual_seconds" '
                      BEGIN {
                        diff = expected - actual
                        if (diff < 0) diff = -diff
                        tolerance = expected * 0.03
                        if (tolerance < 5) tolerance = 5
                        exit !(diff <= tolerance)
                      }
                    '
                  )" || duration_ok=""

                  if [[ -z "$duration_ok" ]]; then
                    echo "Duration mismatch; quarantining."
                    printf '%s | source=%s | track=%s | provider=%s | class=identity-mismatch | expected=%ss | actual=%ss\n' \
                      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                      "$spotify_url" "$title" "$provider" \
                      "$expected_seconds" "$actual_seconds" >> "$source_failures"
                    mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")" || true
                    continue
                  fi
                fi

                downloaded="$candidate"
                echo "Validated download: $downloaded"
                break
              done

              if [[ -z "$downloaded" ]]; then
                echo "All providers failed for: $spotify_url"
                continue
              fi

              # Canonical Spotify metadata.
              # The downloaded provider metadata is deliberately overwritten.
              final_name="$(printf '%02d - %s.mp3' "$track_number" "$title")"
              final_path="$output_base/$final_name"

              if [[ "$downloaded" != "$final_path" ]]; then
                mv -f "$downloaded" "$final_path"
                downloaded="$final_path"
              fi

              release_year="$year"
              if [[ -z "$release_year" && "$release_date" =~ ^([0-9]{4}) ]]; then
                release_year="${BASH_REMATCH[1]}"
              fi

              explicit_text="No"
              [[ "$explicit" == "true" ]] && explicit_text="Yes"

              # ffmpeg metadata replacement. Spotify values are canonical.
              metadata_tmp="${downloaded}.tmp.mp3"

              ffmpeg -y -v error -i "$downloaded" -map 0:a:0 \
                -map_metadata -1 \
                -c:a copy \
                -metadata title="$title" \
                -metadata artist="$artist" \
                -metadata album="$album" \
                -metadata album_artist="$album_artist" \
                -metadata track="$track_number" \
                -metadata disc="$disc_number" \
                -metadata date="$release_date" \
                -metadata year="$release_year" \
                -metadata genre="$genre" \
                -metadata compilation="$explicit_text" \
                -metadata comment="Spotify canonical metadata; Spotify URL: $spotify_url" \
                "$metadata_tmp"

              mv -f "$metadata_tmp" "$downloaded"

              # Optional Spotify artwork. Failure to retrieve artwork is non-fatal.
              if [[ -n "$cover_url" && "$cover_url" != "null" ]]; then
                cover_tmp="/tmp/cover-${source_id}-${track_index}.jpg"

                if curl -L --fail --silent --show-error \
                    --max-time 20 "$cover_url" -o "$cover_tmp"; then

                  artwork_tmp="${downloaded}.art.mp3"

                  if ffmpeg -y -v error \
                      -i "$downloaded" \
                      -i "$cover_tmp" \
                      -map 0:a:0 \
                      -map 1:v:0 \
                      -map_metadata 0 \
                      -c:a copy \
                      -c:v mjpeg \
                      -disposition:v attached_pic \
                      "$artwork_tmp"; then
                    mv -f "$artwork_tmp" "$downloaded"
                  fi

                  rm -f "$cover_tmp"
                fi
              fi

              # Lyrics are intentionally not part of Tier 1 because they require
              # an additional external lyrics provider and should remain optional.

              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$spotify_url" \
                "$downloaded" \
                "$artist" \
                "$album" \
                "$album_artist" \
                "$title" \
                "$track_number" \
                "$disc_number" \
                "$release_date" \
                "$genre" \
                "$explicit" \
                "$duration_ms" \
                "$cover_url" \
                "$isrc" \
                "$source_id" >> "$source_verified"

              printf '%s\n' "$spotify_url" >> "$VERIFIED_FILE"

            done < "$source_records"

            # Keep failures from this source in the global run report.
            if [[ -s "$source_failures" ]]; then
              cat "$source_failures" >> "$FAILURES_FILE"
            fi

            if [[ ! -s "$source_verified" ]]; then
              echo "No verified downloads for source #$source_id."
              continue
            fi

            echo
            echo "Source #$source_id verified downloads:"
            cat "$source_verified"

            # The actual library checkpoint is handled below, one source at a time.
            cp "$source_verified" "$source_staged"

            # Export the source state for the library step.
            cp "$source_staged" "/tmp/current-source-staged.tsv"

            if ! ./scripts/push-source-to-library.sh "$source_id" "$source_staged"; then
              echo "Library checkpoint failed for source #$source_id"
              echo "Tracks from this source remain unarchived and will be retried."
              continue
            fi

            echo "Library checkpoint succeeded for source #$source_id"

            # Archive ONLY tracks that made it through the successful library
            # checkpoint. The helper writes them to this file.
            if [[ -f "/tmp/source-${source_id}-archived.txt" ]]; then
              cat "/tmp/source-${source_id}-archived.txt" >> archive.txt
              sort -u archive.txt -o archive.txt
            fi

            # Clear successfully processed source files before continuing.
            rm -f "$source_staged"

          done

      # This creates the helper used by the Tier 1 source checkpoint above.
      - name: Install library checkpoint helper
        run: |
          set -euo pipefail

          mkdir -p scripts

          cat > scripts/push-source-to-library.sh <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail

          source_id="$1"
          source_staged="$2"

          : "${LIBRARY_LIMIT_BYTES:?}"
          : "${QUARANTINE_DIR:?}"

          if [[ ! -s "$source_staged" ]]; then
            exit 0
          fi

          token="${GIT_PAT:?}"
          owner="donbt256"
          repo_prefix="music-library"

          api="https://api.github.com"

          auth_headers=(
            -H "Authorization: Bearer $token"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          highest=0
          page=1

          while :; do
            response="$(curl -fsSL "${auth_headers[@]}" \
              "$api/user/repos?per_page=100&page=$page")"

            count="$(jq 'length' <<< "$response")"
            (( count == 0 )) && break

            while IFS= read -r name; do
              if [[ "$name" =~ ^music-library-([0-9]{3})$ ]]; then
                n="${BASH_REMATCH[1]}"
                n=$((10#$n))
                (( n > highest )) && highest="$n"
              fi
            done < <(jq -r '.[].name' <<< "$response")

            (( count < 100 )) && break
            page=$((page + 1))
          done

          (( highest == 0 )) && highest=1

          library_dir="/tmp/library-work"
          rm -rf "$library_dir"
          mkdir -p "$library_dir"

          # Build an MD5 index across all existing library repositories.
          hash_index="/tmp/library-hashes.tsv"
          : > "$hash_index"

          for n in $(seq 1 "$highest"); do
            repo="$(printf '%s-%03d' "$repo_prefix" "$n")"
            repo_url="https://github.com/$owner/$repo.git"
            clone_dir="$library_dir/$repo"

            if ! git clone --quiet "$repo_url" "$clone_dir" 2>/dev/null; then
              echo "Could not clone $repo; continuing."
              continue
            fi

            while IFS= read -r -d '' file; do
              hash="$(md5sum "$file" | awk '{print $1}')"
              printf '%s\t%s\t%s\n' "$hash" "$repo" "${file#$clone_dir/}" >> "$hash_index"
            done < <(find "$clone_dir" -type f -iname '*.mp3' -print0)
          done

          current_repo="$highest"
          current_name="$(printf '%s-%03d' "$repo_prefix" "$current_repo")"
          current_dir="$library_dir/$current_name"

          if [[ ! -d "$current_dir/.git" ]]; then
            current_dir="$library_dir/$(printf '%s-%03d' "$repo_prefix" 1)"
          fi

          : > "/tmp/source-${source_id}-archived.txt"

          while IFS=$'\t' read -r spotify_url file artist album album_artist title track_number disc_number release_date genre explicit duration_ms cover_url isrc record_source_id; do
            [[ "$record_source_id" == "$source_id" ]] || continue
            [[ -f "$file" ]] || continue

            hash="$(md5sum "$file" | awk '{print $1}')"

            if grep -Fq "${hash}"$'\t' "$hash_index"; then
              echo "Exact duplicate already exists in library:"
              grep -F "${hash}"$'\t' "$hash_index" | head -n1

              printf '%s\n' "$spotify_url" >> "/tmp/source-${source_id}-archived.txt"
              continue
            fi

            safe_artist="$(printf '%s' "$artist" | tr '/:' '__')"
            safe_album="$(printf '%s' "$album" | tr '/:' '__')"
            safe_title="$(printf '%s' "$title" | tr '/:' '__')"

            destination_dir="$current_dir/$safe_artist/$safe_album"
            mkdir -p "$destination_dir"

            destination="$destination_dir/$(printf '%02d - %s.mp3' "$track_number" "$safe_title")"

            # Calculate current tracked size and projected size.
            current_size="$(git -C "$current_dir" ls-files -z \
              | xargs -0 -r -I{} stat -c '%s' "$current_dir/{}" \
              | awk '{sum += $1} END {print sum+0}')"

            file_size="$(stat -c '%s' "$file")"

            if (( current_size + file_size > LIBRARY_LIMIT_BYTES )); then
              echo "Rolling over from $current_name."

              git -C "$current_dir" add -A
              if ! git -C "$current_dir" diff --cached --quiet; then
                git -C "$current_dir" \
                  -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "Add music from source #$source_id"
                git -C "$current_dir" push origin main
              fi

              current_repo=$((current_repo + 1))
              current_name="$(printf '%s-%03d' "$repo_prefix" "$current_repo")"
              current_dir="$library_dir/$current_name"

              if [[ ! -d "$current_dir/.git" ]]; then
                new_repo_payload="$(jq -n \
                  --arg name "$current_name" \
                  '{name:$name,private:true,auto_init:true}')"

                curl -fsSL -X POST "${auth_headers[@]}" \
                  -H "Content-Type: application/json" \
                  "$api/user/repos" \
                  -d "$new_repo_payload" >/dev/null

                git clone --quiet \
                  "https://github.com/$owner/$current_name.git" \
                  "$current_dir"
              fi

              destination_dir="$current_dir/$safe_artist/$safe_album"
              mkdir -p "$destination_dir"
              destination="$destination_dir/$(printf '%02d - %s.mp3' "$track_number" "$safe_title")"
            fi

            cp "$file" "$destination"

            printf '%s\t%s\t%s\n' "$hash" "$current_name" "${destination#$current_dir/}" >> "$hash_index"
            printf '%s\n' "$spotify_url" >> "/tmp/source-${source_id}-archived.txt"

          done < "$source_staged"

          # Commit and push the source checkpoint.
          if git -C "$current_dir" status --short | grep -q .; then
            git -C "$current_dir" add -A
            git -C "$current_dir" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add music from source #$source_id"

            git -C "$current_dir" push origin main
          fi

          echo "Library checkpoint completed for source #$source_id"
          HELPER

          chmod +x scripts/push-source-to-library.sh

      - name: Update downloader state safely
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          # State files are generated locally, then merged onto the newest
          # origin/main instead of using git pull --rebase. This avoids the
          # failed.txt rebase conflict seen when concurrent runs finish close
          # together.
          new_failures="/tmp/current-run-failures.txt"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -f "$new_failures" && -s "$new_failures" ]]; then
            cp "$new_failures" /tmp/new-failures.txt
          else
            : > /tmp/new-failures.txt
          fi

          # archive.txt is already updated by successful source checkpoints.
          # Preserve it while refreshing the branch.
          cp archive.txt /tmp/local-archive.txt 2>/dev/null || : > /tmp/local-archive.txt

          for attempt in 1 2 3 4 5; do
            echo "State update attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            touch failed.txt archive.txt

            if [[ -s /tmp/new-failures.txt ]]; then
              cat /tmp/new-failures.txt >> failed.txt
              sort -u failed.txt -o failed.txt
            fi

            if [[ -s /tmp/local-archive.txt ]]; then
              cat /tmp/local-archive.txt >> archive.txt
              sort -u archive.txt -o archive.txt
            fi

            git add failed.txt archive.txt

            if git diff --cached --quiet; then
              echo "No downloader state changes to commit."
              break
            fi

            git commit -m "Update download state"

            if git push origin HEAD:main; then
              echo "Downloader state pushed successfully."
              break
            fi

            echo "Push raced another run; retrying."
            git reset --hard HEAD^
            sleep "$attempt"
          done

      - name: Write run summary
        if: always()
        run: |
          {
            echo "# Spotify downloader run"
            echo
            echo "- Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Verified downloads: $(wc -l < "$VERIFIED_FILE" 2>/dev/null || echo 0)"
            echo "- Provider failures/quarantine events: $(wc -l < "$FAILURES_FILE" 2>/dev/null || echo 0)"
            echo
            echo "## Failures"
            if [[ -s "$FAILURES_FILE" ]]; then
              echo '```text'
              cat "$FAILURES_FILE"
              echo '```'
            else
              echo "None recorded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
