name: Download Spotify Music

on:
  workflow_dispatch:
  push:
    paths:
      - "urls.txt"
      - ".github/workflows/download.yml"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: spotify-music-downloader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    env:
      LIBRARY_LIMIT_BYTES: 943718400
      OUTPUT_DIR: /tmp/music-downloads
      QUARANTINE_DIR: /tmp/music-quarantine
      VERIFIED_FILE: /tmp/verified-downloads.txt
      FAILURES_FILE: /tmp/current-run-failures.txt
      RESOLVED_FILE: /tmp/resolved-tracks.jsonl

    steps:
      - name: Check out downloader
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq curl
          python -m pip install --upgrade pip
          python -m pip install "spotdl==4.5.2"
          spotdl --download-deno

      - name: Prepare directories
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_DIR" "$QUARANTINE_DIR"
          mkdir -p "$OUTPUT_DIR" "$QUARANTINE_DIR"
          : > "$VERIFIED_FILE"
          : > "$FAILURES_FILE"
          : > "$RESOLVED_FILE"

      # The helper MUST exist before the processing step uses it.
      - name: Install library checkpoint helper
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          mkdir -p scripts

          cat > scripts/push-source-to-library.sh <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail

          source_id="$1"
          source_staged="$2"

          : "${GIT_PAT:?GIT_PAT is required}"
          : "${LIBRARY_LIMIT_BYTES:?LIBRARY_LIMIT_BYTES is required}"

          owner="donbt256"
          repo_prefix="music-library"
          api="https://api.github.com"

          auth_headers=(
            -H "Authorization: Bearer $GIT_PAT"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          library_dir="/tmp/library-work"
          hash_index="/tmp/library-hashes.tsv"

          rm -rf "$library_dir"
          mkdir -p "$library_dir"
          : > "$hash_index"

          repo_exists() {
            local repo="$1"
            curl -fsSL "${auth_headers[@]}" \
              "$api/repos/$owner/$repo" >/dev/null 2>&1
          }

          ensure_repo() {
            local repo="$1"
            local dir="$2"

            if [[ -d "$dir/.git" ]]; then
              return 0
            fi

            if ! repo_exists "$repo"; then
              echo "Creating private repository $repo"
              curl -fsSL -X POST "${auth_headers[@]}" \
                -H "Content-Type: application/json" \
                "$api/user/repos" \
                -d "$(jq -n --arg name "$repo" \
                  '{name:$name,private:true,auto_init:true}')"
            fi

            git clone --quiet \
              "https://github.com/$owner/$repo.git" \
              "$dir"
          }

          # Find the highest existing music-library-NNN repository.
          highest=0
          page=1

          while :; do
            response="$(curl -fsSL "${auth_headers[@]}" \
              "$api/user/repos?per_page=100&page=$page")"

            count="$(jq 'length' <<< "$response")"
            (( count == 0 )) && break

            while IFS= read -r name; do
              if [[ "$name" =~ ^music-library-([0-9]{3})$ ]]; then
                n=$((10#${BASH_REMATCH[1]}))
                (( n > highest )) && highest="$n"
              fi
            done < <(jq -r '.[].name' <<< "$response")

            (( count < 100 )) && break
            page=$((page + 1))
          done

          # Always ensure library 001 exists.
          if (( highest == 0 )); then
            highest=1
          fi

          for n in $(seq 1 "$highest"); do
            repo="$(printf 'music-library-%03d' "$n")"
            clone_dir="$library_dir/$repo"
            ensure_repo "$repo" "$clone_dir"

            while IFS= read -r -d '' file; do
              hash="$(md5sum "$file" | awk '{print $1}')"
              printf '%s\t%s\t%s\n' \
                "$hash" "$repo" "${file#$clone_dir/}" >> "$hash_index"
            done < <(find "$clone_dir" -type f -iname '*.mp3' -print0)
          done

          current_repo="$highest"
          current_name="$(printf 'music-library-%03d' "$current_repo")"
          current_dir="$library_dir/$current_name"

          : > "/tmp/source-${source_id}-archived.txt"

          while IFS=$'\t' read -r \
              spotify_url file artist album album_artist title \
              track_number disc_number release_date genre explicit \
              duration_ms cover_url isrc record_source_id; do

            [[ "$record_source_id" == "$source_id" ]] || continue
            [[ -f "$file" ]] || continue

            hash="$(md5sum "$file" | awk '{print $1}')"

            if grep -Fq "${hash}"$'\t' "$hash_index"; then
              echo "Exact duplicate already exists:"
              grep -F "${hash}"$'\t' "$hash_index" | head -n1
              printf '%s\n' "$spotify_url" >> "/tmp/source-${source_id}-archived.txt"
              continue
            fi

            safe_artist="$(printf '%s' "$artist" | tr '/:' '__')"
            safe_album="$(printf '%s' "$album" | tr '/:' '__')"
            safe_title="$(printf '%s' "$title" | tr '/:' '__')"

            current_size="$(
              git -C "$current_dir" ls-files -z |
              while IFS= read -r -d '' tracked; do
                stat -c '%s' "$current_dir/$tracked"
              done |
              awk '{sum += $1} END {print sum+0}'
            )"

            file_size="$(stat -c '%s' "$file")"

            if (( current_size + file_size > LIBRARY_LIMIT_BYTES )); then
              echo "Library $current_name would exceed 900 MiB; rolling over."

              if git -C "$current_dir" status --short | grep -q .; then
                git -C "$current_dir" add -A
                git -C "$current_dir" \
                  -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "Add music from source #$source_id"
                git -C "$current_dir" push origin main
              fi

              current_repo=$((current_repo + 1))
              current_name="$(printf 'music-library-%03d' "$current_repo")"
              current_dir="$library_dir/$current_name"

              ensure_repo "$current_name" "$current_dir"
            fi

            destination_dir="$current_dir/$safe_artist/$safe_album"
            mkdir -p "$destination_dir"

            destination="$destination_dir/$(printf '%02d - %s.mp3' "$track_number" "$safe_title")"

            cp "$file" "$destination"

            printf '%s\t%s\t%s\n' \
              "$hash" "$current_name" "${destination#$current_dir/}" >> "$hash_index"

            printf '%s\n' "$spotify_url" >> "/tmp/source-${source_id}-archived.txt"

          done < "$source_staged"

          # One checkpoint commit/push for this album/playlist/source.
          if git -C "$current_dir" status --short | grep -q .; then
            git -C "$current_dir" add -A
            git -C "$current_dir" \
              -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Add music from source #$source_id"
            git -C "$current_dir" push origin main
          fi

          echo "Library checkpoint succeeded for source #$source_id"
          HELPER

          chmod +x scripts/push-source-to-library.sh

      - name: Resolve Spotify sources
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [[ ! -f urls.txt ]]; then
            echo "urls.txt not found."
            exit 1
          fi

          source_index=0

          while IFS= read -r raw || [[ -n "$raw" ]]; do
            raw="${raw#"${raw%%[![:space:]]*}"}"
            raw="${raw%"${raw##*[![:space:]]}"}"

            [[ -z "$raw" ]] && continue
            [[ "$raw" == \#* ]] && continue

            source_index=$((source_index + 1))
            source_file="/tmp/source-${source_index}.spotdl"

            echo "========================================"
            echo "Resolving source #$source_index"
            echo "$raw"
            echo "========================================"

            rm -f "$source_file"

            # spotDL save files MUST use the .spotdl extension.
            if ! spotdl save "$raw" \
                --client-id "$SPOTIFY_CLIENT_ID" \
                --client-secret "$SPOTIFY_CLIENT_SECRET" \
                --save-file "$source_file"; then
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) | source=$raw | class=resolve-failure" \
                | tee -a "$FAILURES_FILE"
              continue
            fi

            if [[ ! -s "$source_file" ]]; then
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) | source=$raw | class=resolve-failure | reason=empty spotdl file" \
                | tee -a "$FAILURES_FILE"
              continue
            fi

            # A .spotdl file is JSON containing Spotify Song objects.
            jq -c '.[]' "$source_file" |
              while IFS= read -r song; do
                url="$(jq -r '.url // empty' <<< "$song")"
                [[ -z "$url" ]] && continue

                jq -c \
                  --arg source_id "$source_index" \
                  --arg source_url "$raw" \
                  '
                  {
                    source_id: ($source_id | tonumber),
                    source_url: $source_url,
                    url: (.url // ""),
                    name: (.name // ""),
                    artist: (.artist // ""),
                    artists: (
                      if (.artists | type) == "array"
                      then (.artists | map(tostring) | join(", "))
                      else (.artist // "")
                      end
                    ),
                    album: (.album_name // ""),
                    album_artist: (.album_artist // .artist // ""),
                    track_number: (.track_number // 1),
                    disc_number: (.disc_number // 1),
                    duration_ms: (
                      if (.duration | type) == "number"
                      then ((.duration * 1000) | floor)
                      else 0
                      end
                    ),
                    release_date: (.original_date // .date // ""),
                    year: (.year // ""),
                    genre: (
                      if (.genres | type) == "array"
                      then (.genres | map(tostring) | join(", "))
                      else (.genre // "")
                      end
                    ),
                    explicit: (.explicit // false),
                    isrc: (.isrc // ""),
                    cover_url: (.cover_url // ""),
                    list_name: (.list_name // ""),
                    list_url: (.list_url // ""),
                    list_position: (.list_position // null),
                    list_length: (.list_length // null)
                  }
                  ' <<< "$song" >> "$RESOLVED_FILE"
              done

          done < urls.txt

          echo
          echo "Resolved source/track records:"
          wc -l "$RESOLVED_FILE"
          echo "Resolved source IDs:"
          jq -r '.source_id' "$RESOLVED_FILE" | sort -n | uniq -c || true

          if [[ ! -s "$RESOLVED_FILE" ]]; then
            echo "ERROR: No Spotify tracks were resolved."
            echo "Check the Resolve Spotify sources step above."
            exit 1
          fi

      - name: Process each Spotify source
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          mapfile -t SOURCE_IDS < <(
            jq -r '.source_id' "$RESOLVED_FILE" | awk '!seen[$0]++'
          )

          for source_id in "${SOURCE_IDS[@]}"; do
            echo
            echo "############################################################"
            echo "Processing Spotify source #$source_id"
            echo "############################################################"

            source_records="/tmp/source-${source_id}-records.jsonl"
            source_failures="/tmp/source-${source_id}-failures.txt"
            source_verified="/tmp/source-${source_id}-verified.tsv"

            : > "$source_records"
            : > "$source_failures"
            : > "$source_verified"

            jq -c --argjson id "$source_id" \
              'select(.source_id == $id)' \
              "$RESOLVED_FILE" > "$source_records"

            track_index=0

            while IFS= read -r record; do
              [[ -z "$record" ]] && continue
              track_index=$((track_index + 1))

              if ! jq -e . >/dev/null 2>&1 <<< "$record"; then
                echo "Invalid resolved JSON for source #$source_id track #$track_index"
                printf '%s | source=%s | class=resolver-data-corruption | reason=invalid JSON record\n'                   "$(date -u +%Y-%m-%dT%H:%M:%SZ)"                   "$source_id" >> "$source_failures"
                continue
              fi

              spotify_url="$(jq -r '.url' <<< "$record")"
              title="$(jq -r '.name' <<< "$record")"
              artist="$(jq -r '.artist' <<< "$record")"
              album="$(jq -r '.album' <<< "$record")"
              album_artist="$(jq -r '.album_artist' <<< "$record")"
              track_number="$(jq -r '.track_number // 1' <<< "$record")"
              disc_number="$(jq -r '.disc_number // 1' <<< "$record")"

              if ! [[ "$track_number" =~ ^[0-9]+$ ]] || (( track_number < 1 )); then
                track_number=1
              fi
              if ! [[ "$disc_number" =~ ^[0-9]+$ ]] || (( disc_number < 1 )); then
                disc_number=1
              fi

              duration_ms="$(jq -r '.duration_ms // 0' <<< "$record")"
              release_date="$(jq -r '.release_date // ""' <<< "$record")"
              year="$(jq -r '.year // ""' <<< "$record")"
              genre="$(jq -r '.genre // ""' <<< "$record")"
              explicit="$(jq -r '.explicit // false' <<< "$record")"
              isrc="$(jq -r '.isrc // ""' <<< "$record")"
              cover_url="$(jq -r '.cover_url // ""' <<< "$record")"

              expected_seconds="0"
              if [[ "$duration_ms" =~ ^[0-9]+$ ]] && (( duration_ms > 0 )); then
                expected_seconds="$(awk -v ms="$duration_ms" 'BEGIN {printf "%.3f", ms/1000}')"
              fi

              safe_artist="$(printf '%s' "$artist" | tr '/:' '__')"
              safe_album="$(printf '%s' "$album" | tr '/:' '__')"
              output_base="$OUTPUT_DIR/$safe_artist/$safe_album"
              mkdir -p "$output_base"

              echo
              echo "Track $track_index"
              echo "$artist - $title"
              echo "Spotify: $spotify_url"

              downloaded=""

              for provider in soundcloud bandcamp piped; do
                echo "Trying provider: $provider"

                provider_log="/tmp/provider-${source_id}-${track_index}-${provider}.log"

                set +e
                spotdl download "$spotify_url" \
                  --client-id "$SPOTIFY_CLIENT_ID" \
                  --client-secret "$SPOTIFY_CLIENT_SECRET" \
                  --audio "$provider" \
                  --format mp3 \
                  --overwrite force \
                  --output "$output_base/{track-number} - {title}.{output-ext}" \
                  --print-errors \
                  > >(tee "$provider_log") 2>&1
                status=$?
                set -e

                if (( status != 0 )); then
                  if grep -Eiq \
                    'DRM|protected|unavailable|no results|not found|removed|private track|deleted' \
                    "$provider_log"; then
                    classification="permanent"
                  elif grep -Eiq \
                    '429|rate.?limit|timed out|timeout|temporar|5[0-9][0-9]|connection|network|502|503|504' \
                    "$provider_log"; then
                    classification="transient"
                  else
                    classification="unknown"
                  fi

                  printf '%s | source=%s | track=%s | provider=%s | class=%s | reason=provider failure\n' \
                    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    "$spotify_url" "$title" "$provider" "$classification" \
                    >> "$source_failures"
                  continue
                fi

                candidate="$(
                  find "$output_base" -maxdepth 1 -type f -iname '*.mp3' \
                    -printf '%T@ %p\n' |
                  sort -nr |
                  head -n1 |
                  cut -d' ' -f2- || true
                )"

                if [[ -z "$candidate" || ! -f "$candidate" ]]; then
                  echo "No MP3 produced by $provider."
                  continue
                fi

                codec="$(
                  ffprobe -v error -select_streams a:0 \
                    -show_entries stream=codec_name \
                    -of default=noprint_wrappers=1:nokey=1 \
                    "$candidate" 2>/dev/null || true
                )"

                actual_seconds="$(
                  ffprobe -v error \
                    -show_entries format=duration \
                    -of default=noprint_wrappers=1:nokey=1 \
                    "$candidate" 2>/dev/null || true
                )"

                if [[ "$codec" != "mp3" || -z "$actual_seconds" ]]; then
                  echo "Invalid audio; quarantining."
                  mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")"
                  continue
                fi

                if ! awk -v d="$actual_seconds" 'BEGIN {exit !(d > 5)}'; then
                  echo "Suspiciously short audio; quarantining."
                  mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")"
                  continue
                fi

                if ! ffmpeg -v error -i "$candidate" -f null - \
                    >/tmp/ffmpeg-check.log 2>&1; then
                  echo "Audio failed decode validation; quarantining."
                  mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")"
                  continue
                fi

                if [[ "$expected_seconds" != "0" ]]; then
                  if ! awk \
                    -v expected="$expected_seconds" \
                    -v actual="$actual_seconds" '
                    BEGIN {
                      diff = expected - actual
                      if (diff < 0) diff = -diff
                      tolerance = expected * 0.03
                      if (tolerance < 5) tolerance = 5
                      exit !(diff <= tolerance)
                    }
                  '; then
                    echo "Duration mismatch; quarantining."
                    printf '%s | source=%s | track=%s | provider=%s | class=identity-mismatch | expected=%ss | actual=%ss\n' \
                      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                      "$spotify_url" "$title" "$provider" \
                      "$expected_seconds" "$actual_seconds" \
                      >> "$source_failures"
                    mv -f "$candidate" "$QUARANTINE_DIR/$(basename "$candidate")"
                    continue
                  fi
                fi

                downloaded="$candidate"
                echo "Validated: $downloaded"
                break
              done

              if [[ -z "$downloaded" ]]; then
                echo "All providers failed for $spotify_url"
                continue
              fi

              final_name="$(printf '%02d - %s.mp3' "$track_number" "$title")"
              final_path="$output_base/$final_name"

              if [[ "$downloaded" != "$final_path" ]]; then
                mv -f "$downloaded" "$final_path"
                downloaded="$final_path"
              fi

              release_year="$year"
              if [[ -z "$release_year" && "$release_date" =~ ^([0-9]{4}) ]]; then
                release_year="${BASH_REMATCH[1]}"
              fi

              metadata_tmp="${downloaded}.tmp.mp3"

              ffmpeg -y -v error \
                -i "$downloaded" \
                -map 0:a:0 \
                -map_metadata -1 \
                -c:a copy \
                -metadata title="$title" \
                -metadata artist="$artist" \
                -metadata album="$album" \
                -metadata album_artist="$album_artist" \
                -metadata track="$track_number" \
                -metadata disc="$disc_number" \
                -metadata date="$release_date" \
                -metadata year="$release_year" \
                -metadata genre="$genre" \
                -metadata comment="Spotify canonical metadata; Spotify URL: $spotify_url" \
                "$metadata_tmp"

              mv -f "$metadata_tmp" "$downloaded"

              # Spotify artwork is optional and non-fatal.
              if [[ -n "$cover_url" && "$cover_url" != "null" ]]; then
                cover_tmp="/tmp/cover-${source_id}-${track_index}.jpg"

                if curl -L --fail --silent --show-error \
                    --max-time 20 "$cover_url" -o "$cover_tmp"; then

                  artwork_tmp="${downloaded}.art.mp3"

                  if ffmpeg -y -v error \
                      -i "$downloaded" \
                      -i "$cover_tmp" \
                      -map 0:a:0 \
                      -map 1:v:0 \
                      -map_metadata 0 \
                      -c:a copy \
                      -c:v mjpeg \
                      -disposition:v attached_pic \
                      "$artwork_tmp"; then
                    mv -f "$artwork_tmp" "$downloaded"
                  fi

                  rm -f "$cover_tmp"
                fi
              fi

              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$spotify_url" \
                "$downloaded" \
                "$artist" \
                "$album" \
                "$album_artist" \
                "$title" \
                "$track_number" \
                "$disc_number" \
                "$release_date" \
                "$genre" \
                "$explicit" \
                "$duration_ms" \
                "$cover_url" \
                "$isrc" \
                "$source_id" >> "$source_verified"

              printf '%s\n' "$spotify_url" >> "$VERIFIED_FILE"

            done < "$source_records"

            if [[ -s "$source_failures" ]]; then
              cat "$source_failures" >> "$FAILURES_FILE"
            fi

            if [[ ! -s "$source_verified" ]]; then
              echo "No verified downloads for source #$source_id."
              continue
            fi

            # This is the per-album/playlist transaction boundary.
            if ! ./scripts/push-source-to-library.sh \
                "$source_id" "$source_verified"; then
              echo "Library checkpoint failed for source #$source_id."
              echo "Nothing from this source is added to archive.txt."
              continue
            fi

            # Only successful library commits/pushes reach this point.
            if [[ -f "/tmp/source-${source_id}-archived.txt" ]]; then
              cat "/tmp/source-${source_id}-archived.txt" >> archive.txt
              sort -u archive.txt -o archive.txt
            fi

            echo "Source #$source_id completed successfully."
          done

      - name: Update downloader state safely
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp "$FAILURES_FILE" /tmp/new-failures.txt 2>/dev/null || : > /tmp/new-failures.txt
          cp archive.txt /tmp/local-archive.txt 2>/dev/null || : > /tmp/local-archive.txt

          for attempt in 1 2 3 4 5; do
            echo "State update attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            touch failed.txt archive.txt

            if [[ -s /tmp/new-failures.txt ]]; then
              cat /tmp/new-failures.txt >> failed.txt
              sort -u failed.txt -o failed.txt
            fi

            if [[ -s /tmp/local-archive.txt ]]; then
              cat /tmp/local-archive.txt >> archive.txt
              sort -u archive.txt -o archive.txt
            fi

            git add failed.txt archive.txt

            if git diff --cached --quiet; then
              echo "No downloader state changes."
              break
            fi

            git commit -m "Update download state"

            if git push origin HEAD:main; then
              echo "Downloader state pushed successfully."
              break
            fi

            echo "Push raced another run; retrying."
            git reset --hard HEAD^
            sleep "$attempt"
          done

      - name: Show run summary
        if: always()
        run: |
          {
            echo "# Spotify downloader run"
            echo
            echo "- Finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Resolved tracks: $(wc -l < "$RESOLVED_FILE" 2>/dev/null || echo 0)"
            echo "- Verified downloads: $(wc -l < "$VERIFIED_FILE" 2>/dev/null || echo 0)"
            echo "- Failure records: $(wc -l < "$FAILURES_FILE" 2>/dev/null || echo 0)"
            echo
            echo "## Failures"
            if [[ -s "$FAILURES_FILE" ]]; then
              echo '```text'
              cat "$FAILURES_FILE"
              echo '```'
            else
              echo "None recorded."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
